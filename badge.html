  현장 데스크 (badge.html → /badge) — 사무국 직원 전용
  · 한 화면에서: ① 사전등록 참관객 QR 확인(→ 팔찌) ② 목걸이 비표 라벨 출력(XP-DT427B, 100×70mm)
  · 로그인: 사무국 관리자(is_admin) 계정
  · 데이터
      비표      public.badges / badge_events (SQL ../badges.sql), RPC badge_sync · badge_mark_printed · badge_set_issued
      참관객    visitor_registrations(읽기만) + visitor_passes(개인 QR 토큰) + visitor_checkins(입장 기록), RPC visitor_checkin
  · 사전등록자 QR 내용 = HTTPS://BIMTC.BUSAN.COM/V/토큰 (개인 화면 v.html)
  · 라벨에는 QR을 넣지 않는다(11/10 사용자). 유형별 내용:
      참가기업 = 국문 부스명 + 영문 부스명 / 바이어·VIP·주최·프레스·통역 = 이름 + 직함 + 소속 / 스탭 = STAFF 진행요원
  · 인터넷이 끊기면 이 PC에 저장된 명단으로 계속 쓰고, 기록은 모아 두었다가 다시 연결되면 올린다.
-->

  // 기준(11/10 대표님 결정 'B안'): 이름·부스명은 모두 같은 크기. 한 줄에 안 들어가면 두 줄로,
  // text-wrap:balance 로 위아래 길이를 비슷하게 나눈다(「NGUYEN VAN / AN」 처럼 한 단어만 떨어지지 않게).

  // ---------- 서버 쓰기 (끊기면 대기열) ----------

  function runJob(j) {
    if (j.op === 'print') return sb.rpc('badge_mark_printed', { p_ids: j.ids, p_desk: j.desk, p_issue: j.issue });
    if (j.op === 'issue') return sb.rpc('badge_set_issued', { p_ids: j.ids, p_on: j.on, p_desk: j.desk });

  // ---------- 불러오기 ----------
  function loadBadges() {
    return sb.from('badges').select(COLS).order('type').order('grp').order('slot').range(0, 4999).then(function (r) {

        if (r.error) throw r.error;

    }

  }

  // ---------- 비표 동작 ----------
  function doPrint(list, issue) {

  function fieldsFor(t) {
    if (t === 'EXHIBITOR') return [['ko', '국문 부스명', 1], ['en', '영문 부스명', 0], ['booth', '부스번호', 0], ['n', '장수(비우면 4)', 0]];

  function guessMap(head, t) {

  function parseGrid(grid) {

  function buildImport() {

      '<tr><td>한 장이 두 라벨에 걸쳐 찍힘 / 빈 라벨이 끼어 나옴</td><td>프린터 <b>노란 버튼</b>을 한 번 딸깍 → 라벨이 나오고 멈추면 맞춤 완료. 롤을 바꿀 때마다 한 번씩.</td></tr>' +
      '<tr><td>흰 라벨만 나옴</td><td>롤을 뒤집어 끼운 것. 긁으면 검게 되는 면이 위로.</td></tr>' +
      '<tr><td>LED 빨강, 안 나옴</td><td>라벨 다 씀 / 덮개 덜 닫힘. 덮개를 ‘딸깍’ 닫고 노란 버튼 한 번.</td></tr>' +
      '<tr><td>아무 반응 없음</td><td>USB·전원 확인 → 프린터 껐다 켜기 → 화면 새로고침(F5).</td></tr>' +
      '<tr><td>글자가 흐림</td><td>팀장에게: 프린터 설정의 농도(Darkness)를 2~3 올림.</td></tr>' +
      '<tr><td>라벨 위치가 배경지 흰 칸과 안 맞음</td><td>라벨은 흰 칸 가운데에 맞춰 손으로 붙입니다(사방 2mm 여유).</td></tr></table></section>' +

      '<section id="g9"><h3>9. 인터넷이 끊겼을 때</h3><ul>' +
      '<li>오른쪽 위가 빨간 <b>끊김</b>으로 바뀌어도 <b>그대로 계속 쓰면 됩니다.</b> QR 확인·출력 모두 이 PC에 저장된 명단으로 동작합니다.</li>' +
      '<li>그동안의 기록은 <b>미전송 n건</b>으로 쌓였다가, 연결되면 자동으로 올라갑니다. <b>미전송이 남아 있을 때 창을 닫거나 로그아웃하지 마세요.</b></li>' +
      '<li>휴대폰 핫스팟에 노트북을 연결하면 바로 복구됩니다.</li>' +
      '<li>여러 데스크가 동시에 쓰면 20초마다 서로의 기록이 반영됩니다. 끊긴 동안엔 다른 자리에서 처리한 건 안 보일 수 있습니다.</li></ul></section>' +

      '<section id="g10"><h3>10. 하루 끝</h3><ol>' +
      '<li>오른쪽 위 <b>미전송 0건</b>(안 보이면 0건)인지 확인.</li>' +
      '<li><b>현황·엑셀</b> 탭 → [참관객 입장 기록], [비표 명단·지급 기록]을 받아 공유 폴더에 저장.</li>' +
      '<li>라벨 남은 양 확인, 다음 날 예비 롤 준비.</li></ol>' +
      '<div class="tip">모르는 상황이면 기록을 지우지 말고 메모칸에 적어 두고 팀장에게 물어보세요. 이 화면에서 한 일은 모두 기록이 남습니다.</div></section>' +
      '</div>';
  }

  // ---------- 시험 출력 ----------
  function testPrint() {
    printLabels([{ type: 'BUYER', name: 'NGUYEN VAN AN', title: 'Director', org: 'Saigon Medical Travel Co., Ltd.' }]);
  }

  // ---------- 로그인·시작 ----------
  function renderLogin(msg) {
    document.getElementById('topRight').hidden = true; document.getElementById('tabs').hidden = true;
    view.innerHTML = '<div class="gate"><h1>현장 데스크</h1><p style="color:#8295ab;margin:4px 0 6px">사무국 관리자 계정으로 로그인하세요.</p>' +
      '<label>이메일</label><input id="liE" type="email" autocomplete="username"><label>비밀번호</label><input id="liP" type="password" autocomplete="current-password">' +
      (msg ? '<div class="err">' + esc(msg) + '</div>' : '') + '<button class="btn dark" id="liB">로그인</button>' +
      '<p style="margin:14px 0 0;text-align:center"><a href="#setup" id="liSetup" style="color:#16294F;font-weight:700">처음 쓰는 노트북이에요 → 프린터 연결부터 따라하기</a></p></div>';
    document.getElementById('liSetup').onclick = function (e) { e.preventDefault(); renderSetupOnly(); };
    function go() {
      var b = document.getElementById('liB'); b.disabled = true; b.textContent = '로그인 중…';
      DB.login(document.getElementById('liE').value.trim(), document.getElementById('liP').value).then(function (r) {
        if (!r.ok) return renderLogin('이메일 또는 비밀번호를 확인해 주세요.');
        boot();
      });
    }
    document.getElementById('liB').onclick = go;
    document.getElementById('liP').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  // 로그인 전에 보는 「처음 시작하기」 (주소 /badge#setup 으로도 바로 열림)
  function renderSetupOnly() {
    document.getElementById('topRight').hidden = true; document.getElementById('tabs').hidden = true;
    view.innerHTML = '<div class="guide setup-only"><p><a href="#" id="soBack" style="color:#16294F;font-weight:700;font-size:17px">← 로그인 화면으로</a></p><section id="gS"><div id="wzBox"></div></section></div>';
    var back = function () { history.replaceState(null, '', location.pathname); boot(); };
    document.getElementById('soBack').onclick = function (e) { e.preventDefault(); back(); };
    wzAt = -1; bindWizard(document.getElementById('wzBox'), back); window.scrollTo(0, 0);
  }
  function boot() {
    if (location.hash === '#setup' && !ME) return renderSetupOnly();
    DB.ready().then(function (c) { sb = c; return DB.currentUser(); }).then(function (u) {
      if (!u) return renderLogin();
      if (!u.is_admin) return renderLogin('이 계정은 관리자 권한이 없습니다.');
      ME = u; start();
    }).catch(function () {
      var c = lsGet(LS_CACHE, null), v = lsGet(LS_VCACHE, null);
      if (c || v) { ROWS = c ? c.rows : []; VIS = v ? v.rows : []; ME = { name: '오프라인' }; start(true); }
      else view.innerHTML = '<div class="empty">인터넷에 연결되지 않았고 이 PC에 저장된 명단도 없습니다.</div>';
    });
  }
  var started = false;
  function start(offline) {
    document.getElementById('who').textContent = ME.name || ME.email || '';
    document.getElementById('topRight').hidden = false; document.getElementById('tabs').hidden = false;
    var dsel = document.getElementById('desk');
    dsel.innerHTML = ['데스크1', '데스크2', '데스크3', '데스크4', '데스크5', '사무국'].map(function (d) { return '<option>' + d + '</option>'; }).join('');
    dsel.value = lsGet(LS_DESK, '데스크1'); dsel.onchange = function () { lsSet(LS_DESK, dsel.value); };
    setQueue(queue());
    document.querySelectorAll('.tab').forEach(function (t) { t.onclick = function () { TAB = t.dataset.t; render(); }; });
    document.getElementById('testBtn').onclick = testPrint;
    if (offline) { setOnline(false); applyQueueLocally(); render(); }
    else load();
    if (started) return; started = true;
    setInterval(function () {
      var a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.id !== 'q';
      if (!typing && sb && (TAB === 'desk' || TAB === 'stat')) flush().then(function () { if (!queue().length) load(true); });
    }, 20000);
    setInterval(function () { if (queue().length && sb) flush(); }, 10000);
    window.addEventListener('online', function () { if (sb) flush(); });
    window.addEventListener('offline', function () { setOnline(false); });
    window.addEventListener('beforeunload', function (e) { if (queue().length) { e.preventDefault(); e.returnValue = ''; } });
  }
  document.getElementById('logout').onclick = function () { if (queue().length && !confirm('아직 서버에 못 올린 기록이 ' + queue().length + '건 있습니다. 로그아웃해도 이 PC에는 남습니다.')) return; DB.logout().then(function () { renderLogin(); }); };
  boot();
})();
</script>
</body>
