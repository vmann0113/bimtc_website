  · 데이터: public.badges / badge_events (SQL: ../badges.sql). 명단 불러오기는 RPC badge_sync().
  · 출력 기록은 RPC badge_mark_printed() 로만 남긴다. 인터넷이 끊기면 기록을 이 PC에 모아 두었다가 다시 연결되면 올린다.
  · 라벨 QR = HTTPS://BIMTC.BUSAN.COM/B/코드 (대문자 — QR이 작아져 감열 라벨에서 잘 읽힘)

<style>

  .stats .s span{color:#6b7f95;font-size:12.5px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
  th,td{padding:8px 10px;border-bottom:1px solid #eef1f5;text-align:left;font-size:13px}
  th{background:#F6F8FB;color:#4b5d72;font-size:12.5px;white-space:nowrap}
  td.c,th.c{text-align:center}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .tools input,.tools select{border:1px solid #c9d4df;border-radius:8px;padding:8px 10px}
  .gate{max-width:380px;margin:60px auto;background:#fff;border-radius:14px;padding:26px}
  .gate h1{font-size:19px;margin:0 0 4px}
  .gate label{display:block;font-size:12.5px;color:#4b5d72;margin:12px 0 4px}
  .gate input{width:100%;border:1px solid #c9d4df;border-radius:8px;padding:10px}
  .gate .btn{width:100%;margin-top:16px;padding:11px}
  .err{color:#B4233C;margin-top:10px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
  .modal .box{background:#fff;border-radius:14px;padding:20px 22px;width:min(560px,100%);max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 10px;font-size:17px}
  .modal textarea{width:100%;min-height:180px;border:1px solid #c9d4df;border-radius:8px;padding:10px;font-size:13px}
  .modal .acts{margin-top:14px;justify-content:flex-end}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0A2236;color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.bad{background:#B4233C}

  /* ===== 라벨 100×70mm (화면 미리보기와 인쇄가 같은 규칙) ===== */
  .lbl{width:100mm;height:70mm;background:#fff;color:#000;position:relative;overflow:hidden;font-family:'Pretendard','Malgun Gothic',sans-serif}
  .lbl .ln{position:absolute;left:4mm;right:4mm;text-align:center;white-space:nowrap;line-height:1.15}
  .lbl .l1{top:7mm;font-size:12.5mm;font-weight:800;letter-spacing:.4mm}
  .lbl .l2{top:24.5mm;font-size:5.6mm;font-weight:700}
  .lbl .l3{top:32.5mm;font-size:4mm;font-weight:500;color:#222}
  .lbl.org .l1{top:6mm;font-size:9mm;white-space:normal;line-height:1.18;max-height:23mm;display:flex;align-items:center;justify-content:center}
  .lbl.org .l2{top:30mm;font-size:4.4mm;font-weight:600}
  .lbl .qr{position:absolute;left:50%;bottom:6mm;width:17mm;height:17mm;transform:translateX(-50%)}
  .lbl .cd{position:absolute;left:0;right:0;bottom:2mm;text-align:center;font-size:2.4mm;font-weight:700;color:#333;letter-spacing:.3mm}
  #printArea{display:none}
  @page{size:100mm 70mm;margin:0}
  @media print{
    body{background:#fff}
    body>*:not(#printArea){display:none!important}
    #printArea{display:block}
    #printArea .lbl{page-break-after:always;break-after:page}
    #printArea .lbl:last-child{page-break-after:auto;break-after:auto}
  }
</style>

<body>
<div class="top"><div class="in"><h1>2026 BIMTC 출입증 발급</h1>

<script>
(function () {
  'use strict';
  var DB = window.BimtcDB, sb = null, ME = null;
  var ROWS = [], SEL = null, TAB = 'desk';
  var F = { q: '', t: '', s: '' };          // 데스크 검색·유형·상태
  var B = { t: 'EXHIBITOR', s: 'np', q: '', pick: {} }; // 미리 출력 탭
  var view = document.getElementById('view');
  var LS_CACHE = 'bimtc_badge_cache_v1', LS_Q = 'bimtc_badge_queue_v1', LS_DESK = 'bimtc_badge_desk';
  var ONLINE = true;

  var TYPES = [
    { k: 'EXHIBITOR', ko: '참가기업', c: '#1E9E78' },
    { k: 'BUYER', ko: '바이어', c: '#E5603B' },
    { k: 'VIP', ko: 'VIP', c: '#B8892E' },
    { k: 'ORGANIZER', ko: '주최·사무국', c: '#22335F' },
    { k: 'STAFF', ko: '스탭', c: '#2A2E36' },
    { k: 'INTERPRETER', ko: '통역', c: '#2F6FD0' }
  ];
  var TY = {}; TYPES.forEach(function (t) { TY[t.k] = t; });
  var COLS = 'id,code,type,name,org,org_en,title,country,grp,booth,source,source_ref,slot,note,void,print_count,first_printed_at,last_printed_at,issued_at,last_desk,created_at,updated_at';

  // ---------- 작은 도구 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function p2(n) { return String(n).padStart(2, '0'); }
  function dt(s) { if (!s) return ''; var d = new Date(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); })); }
  function tempCode() { var a = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ', c = 'T'; for (var i = 0; i < 6; i++) c += a[Math.floor(Math.random() * 32)]; return c; }
  function toast(msg, bad) { var t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, bad ? 4200 : 2200); }
  function desk() { return document.getElementById('desk').value || '데스크'; }
  function norm(s) { return String(s || '').toLowerCase().replace(/[\s()㈜\-·.,]/g, '').replace(/주식회사|\(주\)|\(사\)/g, ''); }

  // 바코드 스캐너가 한글 입력 상태에서 찍히면 'HTTPS://...' 가 'ㅗㅅㅅㅔㄴ' 처럼 들어온다 → 영문 자판으로 되돌린다.
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
  var KEY = { 'ㅂ': 'q', 'ㅈ': 'w', 'ㄷ': 'e', 'ㄱ': 'r', 'ㅅ': 't', 'ㅛ': 'y', 'ㅕ': 'u', 'ㅑ': 'i', 'ㅐ': 'o', 'ㅔ': 'p', 'ㅁ': 'a', 'ㄴ': 's', 'ㅇ': 'd', 'ㄹ': 'f', 'ㅎ': 'g', 'ㅗ': 'h', 'ㅓ': 'j', 'ㅏ': 'k', 'ㅣ': 'l', 'ㅋ': 'z', 'ㅌ': 'x', 'ㅊ': 'c', 'ㅍ': 'v', 'ㅠ': 'b', 'ㅜ': 'n', 'ㅡ': 'm', 'ㅃ': 'Q', 'ㅉ': 'W', 'ㄸ': 'E', 'ㄲ': 'R', 'ㅆ': 'T', 'ㅒ': 'O', 'ㅖ': 'P',
    'ㅘ': 'hk', 'ㅙ': 'ho', 'ㅚ': 'hl', 'ㅝ': 'nj', 'ㅞ': 'np', 'ㅟ': 'nl', 'ㅢ': 'ml', 'ㄳ': 'rt', 'ㄵ': 'sw', 'ㄶ': 'sg', 'ㄺ': 'fr', 'ㄻ': 'fa', 'ㄼ': 'fq', 'ㄽ': 'ft', 'ㄾ': 'fx', 'ㄿ': 'fv', 'ㅀ': 'fg', 'ㅄ': 'qt' };
  function hangulToKeys(s) {
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i], c = ch.charCodeAt(0);
      if (c >= 0xAC00 && c <= 0xD7A3) {
        var x = c - 0xAC00, jo = x % 28, ju = ((x - jo) / 28) % 21, ch0 = Math.floor(x / 588);
        out += (KEY[CHO[ch0]] || '') + (KEY[JUNG[ju]] || '') + (jo ? (KEY[JONG[jo]] || '') : '');
      } else out += KEY[ch] || ch;
    }
    return out;
  }
  // 입력에서 출입증 코드를 뽑는다(QR 주소·코드만·한글로 찍힌 것 모두)
  function codeFrom(s) {
    s = String(s || '').trim(); if (!s) return null;
    var t = /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(s) ? hangulToKeys(s) : s;
    var m = t.match(/\/b\/([0-9a-z]{7})/i) || t.match(/^\s*([bt][0-9a-z]{6})\s*$/i);
    return m ? m[1].toUpperCase() : null;
  }

  // ---------- 라벨 ----------
  function qrSvg(text) {
    if (!window.qrcode) return '<svg class="qr" viewBox="0 0 10 10"></svg>';
    var q = window.qrcode(0, 'M'); q.addData(text, 'Alphanumeric'); q.make();
    var n = q.getModuleCount(), m = 2, r = '';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (q.isDark(y, x)) r += 'M' + (x + m) + ' ' + (y + m) + 'h1v1h-1z';
    return '<svg class="qr" viewBox="0 0 ' + (n + m * 2) + ' ' + (n + m * 2) + '" shape-rendering="crispEdges"><path d="' + r + '"/></svg>';
  }
  function qrText(code) { return 'HTTPS://BIMTC.BUSAN.COM/B/' + code; }
  function labelLines(b) {
    var sub = [];
    if (b.type === 'BUYER') { if (b.title) sub.push(b.title); if (b.country) sub.push(String(b.country).toUpperCase()); }
    else if (b.title) sub.push(b.title);
    if (b.type === 'EXHIBITOR' || !b.name) {          // 참가기업 비표는 회사명만 찍는다(11/9 사용자 확인 — 부스 비표에 개인 이름 없음)
      var l2 = b.org_en && b.org_en !== b.org ? b.org_en : '';
      return { org: true, l1: b.org || '', l2: l2, l3: '' };
    }
    return { org: false, l1: b.name, l2: b.org || '', l3: sub.join(' · ') };
  }
  function labelHtml(b) {
    var L = labelLines(b);
    return '<div class="lbl' + (L.org ? ' org' : '') + '">' +
      '<div class="ln l1" data-fit>' + esc(L.l1) + '</div>' +
      (L.l2 ? '<div class="ln l2" data-fit>' + esc(L.l2) + '</div>' : '') +
      (L.l3 ? '<div class="ln l3" data-fit>' + esc(L.l3) + '</div>' : '') +
      qrSvg(qrText(b.code)) + '<div class="cd">' + esc(b.code) + '</div></div>';
  }
  // 넘치면 글자를 줄인다. 회사명 2줄 모드는 높이로, 나머지는 너비로 잰다.
  function fitAll(root) {
    root.querySelectorAll('[data-fit]').forEach(function (el) {
      var s = parseFloat(getComputedStyle(el).fontSize), wrap = getComputedStyle(el).whiteSpace !== 'nowrap', g = 0;
      while (g++ < 80 && s > 7 && (wrap ? el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1 : el.scrollWidth > el.clientWidth + 1)) {
        s -= 0.5; el.style.fontSize = s + 'px';
      }
    });
  }

  // 인쇄: 라벨을 인쇄 영역에 넣고 window.print(). 크롬을 --kiosk-printing 으로 띄우면 인쇄 창 없이 바로 나간다.
  function printLabels(list) {
    var pa = document.getElementById('printArea');
    pa.innerHTML = list.map(labelHtml).join('');
    pa.style.display = 'block'; pa.style.position = 'fixed'; pa.style.left = '-200mm'; pa.style.top = '0';
    return (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
      fitAll(pa);
      pa.removeAttribute('style');
      return new Promise(function (res) { setTimeout(function () { window.print(); res(); }, 60); });
    });
  }

  // ---------- 서버 쓰기 (끊기면 대기열) ----------
  function queue() { return lsGet(LS_Q, []); }
  function setQueue(q) { lsSet(LS_Q, q); var p = document.getElementById('qPill'); p.hidden = !q.length; document.getElementById('qN').textContent = q.length; }
  function enqueue(job) { var q = queue(); q.push(job); setQueue(q); }
  function runJob(j) {
    if (j.op === 'print') return sb.rpc('badge_mark_printed', { p_ids: j.ids, p_desk: j.desk, p_issue: j.issue });
    if (j.op === 'issue') return sb.rpc('badge_set_issued', { p_ids: j.ids, p_on: j.on, p_desk: j.desk });
    if (j.op === 'insert') return sb.from('badges').insert(j.rows).select(COLS);
    if (j.op === 'update') return sb.from('badges').update(j.patch).eq('id', j.id).select(COLS);
    if (j.op === 'event') return sb.from('badge_events').insert(j.rows);
    return Promise.resolve({});
  }
  // 한 번에 하나만 올린다(동시에 여러 번 부르면 같은 기록이 중복 전송된다)
  var FLUSHING = null;
  function flush() {
    if (FLUSHING) return FLUSHING;
    FLUSHING = flushStep().then(function () { FLUSHING = null; }, function () { FLUSHING = null; });
    return FLUSHING;
  }
  function flushStep() {
    var q = queue(); if (!q.length || !sb) return Promise.resolve();
    var j = q[0];
    return runJob(j).then(function (r) {
      if (r && r.error) {
        if (/fetch|network|Failed/i.test(r.error.message || '')) { setOnline(false); return; }
        // 서버가 거절한 기록(권한·중복 등)은 빼고 알린다. 다음 건 계속.
        toast('기록 1건을 올리지 못했습니다: ' + r.error.message, true);
      }
      setOnline(true); q = queue(); q.shift(); setQueue(q); return flushStep();
    }, function () { setOnline(false); });
  }
  function send(job) {               // 낙관적 반영은 호출하는 쪽이 한다
    enqueue(job); return flush();
  }
  function setOnline(on) {
    ONLINE = on; var n = document.getElementById('net');
    n.classList.toggle('off', !on); document.getElementById('netT').textContent = on ? '연결됨' : '끊김 · 이 PC에 저장 중';
  }

  // ---------- 불러오기 ----------
  function load(silent) {
    return sb.from('badges').select(COLS).order('type').order('grp').order('slot').range(0, 4999).then(function (r) {
      if (r.error) throw r.error;
      ROWS = r.data || []; lsSet(LS_CACHE, { at: Date.now(), rows: ROWS }); setOnline(true);
      // 대기열에 있는 로컬 변경을 다시 덮어 씌운다(아직 안 올라간 출력 표시가 사라지지 않게)
      applyQueueLocally();
      if (SEL) SEL = ROWS.find(function (x) { return x.id === SEL.id; }) || null;
      render(silent);
    }).catch(function (e) {
      setOnline(false);
      var c = lsGet(LS_CACHE, null);
      if (c && !ROWS.length) { ROWS = c.rows || []; applyQueueLocally(); render(); toast('인터넷 연결이 안 돼 이 PC에 저장된 명단(' + dt(c.at) + ')으로 엽니다.', true); }
      else if (!silent) render();
    });
  }
  function applyQueueLocally() {
    queue().forEach(function (j) {
      if (j.op === 'insert') j.rows.forEach(function (row) { if (!ROWS.some(function (x) { return x.id === row.id; })) ROWS.push(Object.assign({ print_count: 0, void: false, slot: 1 }, row)); });
      if (j.op === 'update') { var b = ROWS.find(function (x) { return x.id === j.id; }); if (b) Object.assign(b, j.patch); }
      if (j.op === 'print') j.ids.forEach(function (id) { var b = ROWS.find(function (x) { return x.id === id; }); if (b && !b._q) localPrinted(b, j.issue, j.desk, j.at); });
    });
  }
  function localPrinted(b, issue, dk, at) {
    var now = at || new Date().toISOString();
    b.print_count = (b.print_count || 0) + 1; b.first_printed_at = b.first_printed_at || now; b.last_printed_at = now; b.last_desk = dk;
    if (issue && !b.issued_at) b.issued_at = now;
  }

  // ---------- 동작 ----------
  function doPrint(list, issue) {
    list = list.filter(function (b) { return !b.void; });
    if (!list.length) return Promise.resolve();
    var again = list.filter(function (b) { return b.print_count > 0; });
    if (again.length) {
      var msg = again.length === 1
        ? '이미 출력한 출입증입니다.\n\n' + (again[0].name || again[0].org) + '\n' + dt(again[0].last_printed_at) + ' · ' + (again[0].last_desk || '') + ' (' + again[0].print_count + '회)\n\n분실·훼손으로 다시 뽑습니까?'
        : '고른 ' + list.length + '장 중 ' + again.length + '장은 이미 출력한 것입니다.\n그래도 모두 다시 출력합니까?';
      if (!confirm(msg)) return Promise.resolve();
    }
    return printLabels(list).then(function () {
      var at = new Date().toISOString();
      list.forEach(function (b) { localPrinted(b, issue, desk(), at); });
      render(true);
      return send({ op: 'print', ids: list.map(function (b) { return b.id; }), desk: desk(), issue: !!issue, at: at });
    });
  }
  function setIssued(list, on) {
    var now = new Date().toISOString();
    list.forEach(function (b) { b.issued_at = on ? (b.issued_at || now) : null; b.last_desk = desk(); });
    render(true);
    return send({ op: 'issue', ids: list.map(function (b) { return b.id; }), on: on, desk: desk() });
  }
  function saveEdit(b, patch) {
    var changed = {}, any = false;
    Object.keys(patch).forEach(function (k) { var v = (patch[k] === '' || patch[k] === undefined) ? null : patch[k]; if ((b[k] || null) !== v) { changed[k] = v; any = true; } });
    if (!any) return Promise.resolve(false);
    var before = {}; Object.keys(changed).forEach(function (k) { before[k] = b[k]; });
    Object.assign(b, changed);
    send({ op: 'update', id: b.id, patch: changed });
    send({ op: 'event', rows: [{ badge_id: b.id, kind: 'edit', desk: desk(), detail: { before: before, after: changed } }] });
    return Promise.resolve(true);
  }
  function addBadges(rows, kind) {
    rows.forEach(function (r) { r.id = uuid(); r.code = r.code || tempCode(); r.source = r.source || 'manual'; r.source_ref = r.source_ref || r.id; r.slot = r.slot || 1; r.grp = r.grp || ('manual:' + r.id); });
    rows.forEach(function (r) { ROWS.push(Object.assign({ print_count: 0, void: false, created_at: new Date().toISOString() }, r)); });
    send({ op: 'insert', rows: rows });
    send({ op: 'event', rows: rows.map(function (r) { return { badge_id: r.id, kind: kind || 'add', desk: desk(), detail: { name: r.name, org: r.org } }; }) });
    return rows;
  }

  // ---------- 화면: 공통 ----------
  function status(b) {
    if (b.void) return '<span class="st vd">무효</span>';
    if (b.issued_at) return '<span class="st ok">지급 ' + dt(b.issued_at) + '</span>';
    if (b.print_count) return '<span class="st pr">출력됨 · 미지급</span>';
    return '<span class="st no">미출력</span>';
  }
  function tbadge(t) { var x = TY[t] || { c: '#888', k: t }; return '<span class="tb" style="background:' + x.c + '">' + esc(x.k) + '</span>'; }
  function groupOf(b) { return ROWS.filter(function (x) { return x.grp === b.grp; }).sort(function (a, c) { return a.slot - c.slot; }); }
  function render(silent) {
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.t === TAB); });
    if (TAB === 'desk') renderDesk(silent);
    else if (TAB === 'bulk') renderBulk();
    else renderStat();
  }

  // ---------- 발급 데스크 ----------
  function matches(b, q) {
    if (!q) return true;
    var c = codeFrom(q); if (c) return b.code === c;
    var n = norm(q);
    var hay = norm([b.name, b.org, b.org_en, b.title, b.country, b.booth, b.code].join(' '));
    return hay.indexOf(n) >= 0;
  }
  function deskList() {
    var q = F.q.trim();
    var list = ROWS.filter(function (b) {
      if (F.t && b.type !== F.t) return false;
      if (F.s === 'np' && (b.print_count || b.void)) return false;
      if (F.s === 'ni' && (b.issued_at || b.void)) return false;
      if (F.s === 'ok' && !b.issued_at) return false;
      return matches(b, q);
    });
    // 참가기업은 회사 하나로 묶어서 보여준다
    var seen = {}, out = [];
    list.forEach(function (b) {
      if (b.type === 'EXHIBITOR' && !codeFrom(q)) { if (seen[b.grp]) return; seen[b.grp] = 1; out.push({ g: true, b: b }); }
      else out.push({ g: false, b: b });
    });
    return out;
  }
  function renderDesk(silent) {
    var listEl = document.getElementById('dList');
    if (!listEl || !silent) {
      view.innerHTML = '<div class="desk"><div>' +
        '<div class="card"><div class="search"><input id="q" placeholder="이름 · 회사명 · 부스번호 · QR 스캔" autocomplete="off" spellcheck="false"><button class="btn" id="qClr">지우기</button></div>' +
        '<div class="hint">QR 스캐너로 찍으면 바로 그 출입증이 열립니다. Enter = 맨 위 결과 선택 · Esc = 지우기</div>' +

          var first = deskList()[0]; if (first) { SEL = first.g ? (groupOf(first.b).find(function (x) { return !x.void && !x.issued_at; }) || first.b) : first.b; drawList(); drawSide(); }

      tc.onclick = function (e) { var v = e.target.dataset && e.target.dataset.v; if (v == null) return; F.t = v; drawList(); };

      sc.innerHTML = [['', '상태 전체'], ['np', '미출력'], ['ni', '미지급'], ['ok', '지급 완료']].map(function (x) { return '<button class="chip" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') +
        '<span style="flex:1"></span><button class="btn" id="addOne">+ 새 출입증</button><button class="btn" id="freeLbl" title="명단 없이 이름만 넣어 출력(인터넷 끊겨도 됨)">임시 라벨</button>';
      sc.onclick = function (e) { var v = e.target.dataset && e.target.dataset.v; if (v == null) return; F.s = v; drawList(); };
      document.getElementById('addOne').onclick = function () { openAdd(); };
      document.getElementById('freeLbl').onclick = function () { openAdd(true); };
      setTimeout(function () { qi.focus(); }, 0);
    }
    drawList(); drawSide();
  }
  function drawList() {
    document.querySelectorAll('#tChips .chip').forEach(function (c) { c.classList.toggle('on', c.dataset.v === F.t); });
    document.querySelectorAll('#sChips .chip').forEach(function (c) { c.classList.toggle('on', c.dataset.v === F.s); });
    var L = deskList(), el = document.getElementById('dList'); if (!el) return;
    if (!L.length) { el.innerHTML = '<div class="card empty">찾는 사람이 없습니다. 오른쪽 위 <b>+ 새 출입증</b>으로 바로 만들 수 있습니다.</div>'; return; }
    var MAX = 120;
    el.innerHTML = L.slice(0, MAX).map(function (it) {
      var b = it.b;
      if (it.g) {
        var g = groupOf(b).filter(function (x) { return !x.void; }), iss = g.filter(function (x) { return x.issued_at; }).length;
        var cur = SEL && SEL.grp === b.grp;

          '<div class="nm"><b>' + esc(b.org) + '</b><span>' + esc(b.booth || '') + (b.org_en ? ' · ' + esc(b.org_en) : '') + '</span></div>' +
          '<div class="slots">' + g.map(function (x) { return '<i class="' + (x.issued_at ? 'k' : x.print_count ? 'p' : '') + '"></i>'; }).join('') + '</div>' +
          '<span class="st ' + (iss >= g.length ? 'ok' : iss ? 'pr' : 'no') + '">' + iss + ' / ' + g.length + '장 지급</span></div>';
      }
      return '<div class="row' + (b.void ? ' void' : '') + (SEL && SEL.id === b.id ? ' sel' : '') + '" data-id="' + b.id + '">' + tbadge(b.type) +
        '<div class="nm"><b>' + esc(b.name || b.org || '(이름 없음)') + '</b><span>' + esc([b.name ? b.org : '', b.title, b.country, b.booth].filter(Boolean).join(' · ')) + '</span></div>' + status(b) + '</div>';
    }).join('') + (L.length > MAX ? '<div class="empty">… ' + (L.length - MAX) + '건 더 있습니다. 검색어를 더 넣어 주세요.</div>' : '');
    el.onclick = function (e) {

      else SEL = ROWS.find(function (x) { return x.id === r.dataset.id; });

  }
  function drawSide() {
    var s = document.getElementById('side'); if (!s) return;

    else if (b.print_count) h += '<div class="alert">미리 출력해 둔 비표가 있습니다(' + dt(b.last_printed_at) + '). 찾아서 건네고 <b>지급 처리</b>를 누르세요.</div>';

        '<div class="hint">회사명 라벨이라 4장이 모두 같습니다. 회사 담당자가 오면 받아 갈 장수만큼 출력·지급하세요.</div></div>';

      return saveEdit(b, patch);

    var ga = document.getElementById('gAdd'); if (ga) ga.onclick = function () {
      var g = groupOf(b), live = g.filter(function (x) { return !x.void; }).length;
      if (live >= 4 && !confirm('기본 4장을 넘습니다(지금 ' + live + '장).\n관리자 확인을 받았으면 [확인]을 누르세요. 추가 발급 기록이 남습니다.')) return;
      var mx = g.reduce(function (m, x) { return Math.max(m, x.slot); }, 0);
      var r = addBadges([{ type: 'EXHIBITOR', org: b.org, org_en: b.org_en, booth: b.booth, grp: b.grp, source: b.source, source_ref: b.source_ref, slot: mx + 1, note: '추가 발급(' + desk() + ')' }], 'extra')[0];
      SEL = ROWS.find(function (x) { return x.id === r.id; }); drawList(); drawSide();
    };
    s.querySelectorAll('.gr').forEach(function (r) { r.onclick = function () { SEL = ROWS.find(function (x) { return x.id === r.dataset.id; }); drawList(); drawSide(); }; });
  }
  function refocus() { var q = document.getElementById('q'); if (q) { q.focus(); q.select(); } }
  function srcLabel(b) { return { booth: '부스 신청', tenant: '공동관 입주사', sign: '상호간판 명단', buyer: '바이어 회원', rsvp: '개막식 회신', manual: '직접 입력' }[b.source] || b.source; }

  // ---------- 새 출입증 / 임시 라벨 / 여러 명 붙여넣기 ----------
  function openAdd(free) {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="box"><h3>' + (free ? '임시 라벨 (인터넷이 끊겨도 출력됨)' : '새 출입증') + '</h3>' +
      '<div class="f"><label>유형</label><select id="nType">' + TYPES.map(function (x) { return '<option value="' + x.k + '"' + (x.k === (F.t || 'STAFF') ? ' selected' : '') + '>' + x.k + ' · ' + x.ko + '</option>'; }).join('') + '</select>' +
      '<label>이름</label><input id="nName" class="big"><label>소속</label><input id="nOrg"><label>직함</label><input id="nTitle"><label>국가</label><input id="nCountry" placeholder="바이어만"></div>' +
      '<div class="info">' + (free ? '출력과 함께 명단에도 추가됩니다. 끊겨 있으면 이 PC에 모아 두었다가 연결되면 올립니다.' : '명단에 추가한 뒤 바로 출력할 수 있습니다.') + '</div>' +
      '<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">여러 명 한꺼번에 붙여넣기</summary>' +
      '<p class="hint">엑셀에서 <b>이름 · 소속 · 직함</b> 세 칸을 복사해 붙여넣으세요(한 줄에 한 명). 위에서 고른 유형으로 들어갑니다.</p><textarea id="nBulk" placeholder="홍길동&#9;부산일보&#9;사업국장"></textarea></details>' +
      '<div class="acts"><button class="btn" id="nCancel">닫기</button><button class="btn dark" id="nSave">' + (free ? '' : '명단에 추가') + (free ? '' : '') + '</button><button class="btn go" id="nPrint">추가하고 출력</button></div></div>';
    document.body.appendChild(m);
    if (free) document.getElementById('nSave').hidden = true;
    document.getElementById('nName').focus();
    function close() { m.remove(); refocus(); }
    document.getElementById('nCancel').onclick = close;
    m.onclick = function (e) { if (e.target === m) close(); };
    function collect() {
      var type = document.getElementById('nType').value, rows = [];
      var bulk = document.getElementById('nBulk').value.trim();
      if (bulk) bulk.split(/\r?\n/).forEach(function (ln) { var c = ln.split('\t'); if (!c[0] || !c[0].trim()) return; rows.push({ type: type, name: c[0].trim(), org: (c[1] || '').trim() || null, title: (c[2] || '').trim() || null }); });
      var nm = document.getElementById('nName').value.trim(), og = document.getElementById('nOrg').value.trim();
      if (nm || og) rows.unshift({ type: type, name: nm || null, org: og || null, title: document.getElementById('nTitle').value.trim() || null, country: document.getElementById('nCountry').value.trim() || null });
      return rows;
    }
    document.getElementById('nSave').onclick = function () { var r = collect(); if (!r.length) return toast('이름이나 소속을 넣어 주세요.', true); addBadges(r); close(); toast(r.length + '명을 명단에 추가했습니다.'); render(); };
    document.getElementById('nPrint').onclick = function () {
      var r = collect(); if (!r.length) return toast('이름이나 소속을 넣어 주세요.', true);
      if (r.length > 1 && !confirm(r.length + '장을 바로 출력합니다.')) return;
      addBadges(r); close();
      var made = r.map(function (x) { return ROWS.find(function (y) { return y.id === x.id; }); });
      SEL = made[0]; doPrint(made, true).then(function () { render(); });
    };
  }

  // ---------- 미리 출력·명단 ----------
  function bulkList() {
    return ROWS.filter(function (b) {
      if (B.t && b.type !== B.t) return false;
      if (b.void) return B.s === 'all';
      if (B.s === 'np' && b.print_count) return false;
      if (B.s === 'p' && !b.print_count) return false;
      return matches(b, B.q);
    });
  }
  function renderBulk() {
    var L = bulkList();
    var picked = L.filter(function (b) { return B.pick[b.id]; });
    view.innerHTML = '<div class="card" style="margin-bottom:12px"><b>행사 전날 미리 출력</b><div class="hint">유형을 고르고 [고른 것 출력]을 누르면 한 번에 뽑습니다. 미리 출력한 것은 <b>미지급</b>으로 남고, 데스크에서 건넬 때 지급 처리합니다. ' +
      '라벨이 한 장씩 비뚤어지면 50장 정도씩 나눠 뽑으세요.</div></div>' +
      '<div class="tools"><select id="bT"><option value="">전체 유형</option>' + TYPES.map(function (t) { return '<option value="' + t.k + '"' + (B.t === t.k ? ' selected' : '') + '>' + t.k + ' · ' + t.ko + '</option>'; }).join('') + '</select>' +
      '<select id="bS"><option value="np"' + (B.s === 'np' ? ' selected' : '') + '>미출력만</option><option value="p"' + (B.s === 'p' ? ' selected' : '') + '>출력한 것</option><option value=""' + (B.s === '' ? ' selected' : '') + '>전부(무효 제외)</option><option value="all"' + (B.s === 'all' ? ' selected' : '') + '>무효 포함</option></select>' +
      '<input id="bQ" placeholder="검색" value="' + esc(B.q) + '">' +
      '<button class="btn" id="bAll">보이는 것 모두 고르기</button><button class="btn" id="bNone">고르기 해제</button>' +
      '<span style="flex:1"></span><button class="btn" id="bSync" title="새로 승인된 부스·바이어·개막식 회신을 명단에 더합니다. 이미 있는 출입증은 건드리지 않습니다.">명단 새로 불러오기</button>' +
      '<button class="btn go" id="bPrint"' + (picked.length ? '' : ' disabled') + '>고른 ' + picked.length + '장 출력</button></div>' +
      '<table><thead><tr><th class="c"><input type="checkbox" id="bChk"></th><th>유형</th><th>이름</th><th>소속</th><th>직함·국가</th><th>부스</th><th class="c">#</th><th>상태</th><th>코드</th></tr></thead><tbody>' +
      L.map(function (b) {
        return '<tr' + (b.void ? ' style="opacity:.45"' : '') + '><td class="c"><input type="checkbox" data-id="' + b.id + '"' + (B.pick[b.id] ? ' checked' : '') + (b.void ? ' disabled' : '') + '></td><td>' + tbadge(b.type) + '</td><td><b>' + esc(b.name || '') + '</b></td><td>' + esc(b.org || '') + '</td><td>' + esc([b.title, b.country].filter(Boolean).join(' · ')) + '</td><td>' + esc(b.booth || '') + '</td><td class="c">' + (b.type === 'EXHIBITOR' ? b.slot : '') + '</td><td>' + status(b) + '</td><td style="font-family:monospace">' + esc(b.code) + '</td></tr>';
      }).join('') + (L.length ? '' : '<tr><td colspan="9" class="empty">해당하는 출입증이 없습니다.</td></tr>') + '</tbody></table>';
    document.getElementById('bT').onchange = function (e) { B.t = e.target.value; renderBulk(); };
    document.getElementById('bS').onchange = function (e) { B.s = e.target.value; renderBulk(); };
    var bq = document.getElementById('bQ'); bq.oninput = function () { B.q = bq.value; clearTimeout(bq._t); bq._t = setTimeout(function () { renderBulk(); var n = document.getElementById('bQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
    document.getElementById('bAll').onclick = function () { L.forEach(function (b) { if (!b.void) B.pick[b.id] = 1; }); renderBulk(); };
    document.getElementById('bNone').onclick = function () { B.pick = {}; renderBulk(); };
    document.getElementById('bChk').onchange = function (e) { L.forEach(function (b) { if (!b.void) { if (e.target.checked) B.pick[b.id] = 1; else delete B.pick[b.id]; } }); renderBulk(); };
    view.querySelectorAll('tbody input[type=checkbox]').forEach(function (c) { c.onchange = function () { if (c.checked) B.pick[c.dataset.id] = 1; else delete B.pick[c.dataset.id]; var n = Object.keys(B.pick).length; var bp = document.getElementById('bPrint'); bp.disabled = !n; bp.textContent = '고른 ' + L.filter(function (b) { return B.pick[b.id]; }).length + '장 출력'; }; });
    document.getElementById('bPrint').onclick = function () {
      var list = L.filter(function (b) { return B.pick[b.id] && !b.void; });
      if (!list.length) return;
      if (!confirm(list.length + '장을 출력합니다. 프린터에 라벨이 충분한지 확인하세요.')) return;
      doPrint(list, false).then(function () { B.pick = {}; renderBulk(); });
    };
    document.getElementById('bSync').onclick = function () {
      if (!ONLINE) return toast('인터넷이 연결돼야 합니다.', true);
      sb.rpc('badge_sync').then(function (r) {
        if (r.error) return toast('불러오기 실패: ' + r.error.message, true);
        var d = r.data || {}; toast('새로 더한 것 — 참가기업 ' + (d.exhibitor || 0) + ' · 바이어 ' + (d.buyer || 0) + ' · VIP ' + (d.vip || 0));
        load();
      });
    };
  }

  // ---------- 현황·엑셀 ----------
  function renderStat() {
    var live = ROWS.filter(function (b) { return !b.void; });
    var tot = { n: live.length, p: live.filter(function (b) { return b.print_count; }).length, i: live.filter(function (b) { return b.issued_at; }).length };
    var day = function (s, d) { return s && new Date(s).getDate() === d; };
    var h = '<div class="stats"><div class="s"><b>' + tot.n + '</b><span>전체 출입증</span></div><div class="s"><b>' + tot.p + '</b><span>출력</span></div><div class="s"><b style="color:#11A37B">' + tot.i + '</b><span>지급 완료</span></div><div class="s"><b>' + (tot.n - tot.i) + '</b><span>남은 것</span></div>' +
      '<div class="s"><b>' + live.filter(function (b) { return day(b.issued_at, 12); }).length + ' / ' + live.filter(function (b) { return day(b.issued_at, 13); }).length + ' / ' + live.filter(function (b) { return day(b.issued_at, 14); }).length + '</b><span>지급일 11/12 · 13 · 14</span></div></div>';
    h += '<div class="tools"><b style="flex:1">유형별</b><button class="btn dark" id="csv">엑셀(CSV) 받기</button></div>';
    h += '<table><thead><tr><th>유형</th><th class="c">전체</th><th class="c">출력</th><th class="c">지급</th><th class="c">남음</th><th class="c">재출력</th><th class="c">무효</th></tr></thead><tbody>' +
      TYPES.map(function (t) {
        var all = ROWS.filter(function (b) { return b.type === t.k; }), l = all.filter(function (b) { return !b.void; });
        return '<tr><td>' + tbadge(t.k) + ' ' + t.ko + '</td><td class="c">' + l.length + '</td><td class="c">' + l.filter(function (b) { return b.print_count; }).length + '</td><td class="c"><b>' + l.filter(function (b) { return b.issued_at; }).length + '</b></td><td class="c">' + l.filter(function (b) { return !b.issued_at; }).length + '</td><td class="c">' + l.filter(function (b) { return b.print_count > 1; }).length + '</td><td class="c">' + (all.length - l.length) + '</td></tr>';
      }).join('') + '</tbody></table>';
    // 참가기업 회사별 미지급
    var ex = {}; ROWS.filter(function (b) { return b.type === 'EXHIBITOR' && !b.void; }).forEach(function (b) { var g = ex[b.grp] || (ex[b.grp] = { org: b.org, booth: b.booth, n: 0, i: 0 }); g.n++; if (b.issued_at) g.i++; });
    var gs = Object.keys(ex).map(function (k) { return ex[k]; }).sort(function (a, c) { return (a.i / a.n) - (c.i / c.n) || String(a.booth).localeCompare(String(c.booth)); });
    h += '<div class="tools" style="margin-top:18px"><b>참가기업별 지급 (덜 받아 간 곳부터)</b></div><table><thead><tr><th>부스</th><th>회사</th><th class="c">지급 / 전체</th></tr></thead><tbody>' +
      gs.map(function (g) { return '<tr><td>' + esc(g.booth || '') + '</td><td>' + esc(g.org) + '</td><td class="c"><span class="st ' + (g.i >= g.n ? 'ok' : g.i ? 'pr' : 'no') + '">' + g.i + ' / ' + g.n + '</span></td></tr>'; }).join('') + '</tbody></table>';
    view.innerHTML = h;
    document.getElementById('csv').onclick = exportCsv;
  }
  function exportCsv() {
    var head = ['코드', '유형', '이름', '소속', '영문 소속', '직함', '국가', '부스', '번호', '출처', '상태', '출력 횟수', '처음 출력', '마지막 출력', '지급 시각', '데스크', '메모'];
    var lines = [head].concat(ROWS.map(function (b) {
      return [b.code, b.type, b.name, b.org, b.org_en, b.title, b.country, b.booth, b.type === 'EXHIBITOR' ? b.slot : '', srcLabel(b),
        b.void ? '무효' : b.issued_at ? '지급' : b.print_count ? '출력·미지급' : '미출력', b.print_count || 0,
        full(b.first_printed_at), full(b.last_printed_at), full(b.issued_at), b.last_desk, b.note];
    }));
    function full(s) { if (!s) return ''; var d = new Date(s); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
    var csv = '﻿' + lines.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    var d = new Date(); a.download = 'BIMTC2026_출입증_' + (d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.csv'; a.click();
  }

  // ---------- 시험 출력 ----------
  function testPrint() {
    printLabels([{ code: 'B2TEST0', type: 'BUYER', name: 'NGUYEN VAN AN', org: 'Saigon Medical Travel', title: 'Director', country: 'Vietnam' }]);
  }

  // ---------- 로그인·시작 ----------
  function renderLogin(msg) {
    document.getElementById('topRight').hidden = true; document.getElementById('tabs').hidden = true;
    view.innerHTML = '<div class="gate"><h1>출입증 발급</h1><p style="color:#8295ab;margin:4px 0 6px">사무국 관리자 계정으로 로그인하세요.</p>' +
      '<label>이메일</label><input id="liE" type="email" autocomplete="username"><label>비밀번호</label><input id="liP" type="password" autocomplete="current-password">' +
      (msg ? '<div class="err">' + esc(msg) + '</div>' : '') + '<button class="btn dark" id="liB">로그인</button></div>';
    function go() {
      var b = document.getElementById('liB'); b.disabled = true; b.textContent = '로그인 중…';
      DB.login(document.getElementById('liE').value.trim(), document.getElementById('liP').value).then(function (r) {
        if (!r.ok) return renderLogin('이메일 또는 비밀번호를 확인해 주세요.');
        boot();
      });
    }
    document.getElementById('liB').onclick = go;
    document.getElementById('liP').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  function boot() {
    DB.ready().then(function (c) { sb = c; return DB.currentUser(); }).then(function (u) {
      if (!u) return renderLogin();
      if (!u.is_admin) return renderLogin('이 계정은 관리자 권한이 없습니다.');
      ME = u; start();
    }).catch(function () {
      // 인터넷이 없을 때: 저장된 명단이 있으면 그걸로 연다(출력·기록은 대기열로)
      var c = lsGet(LS_CACHE, null);
      if (c) { ROWS = c.rows || []; ME = { name: '오프라인' }; start(true); }
      else view.innerHTML = '<div class="empty">인터넷에 연결되지 않았고 이 PC에 저장된 명단도 없습니다.</div>';
    });
  }
  function start(offline) {
    document.getElementById('who').textContent = ME.name || ME.email || '';
    document.getElementById('topRight').hidden = false; document.getElementById('tabs').hidden = false;
    var dsel = document.getElementById('desk');
    dsel.innerHTML = ['데스크1', '데스크2', '데스크3', '데스크4', '사무국'].map(function (d) { return '<option>' + d + '</option>'; }).join('');
    dsel.value = lsGet(LS_DESK, '데스크1'); dsel.onchange = function () { lsSet(LS_DESK, dsel.value); };
    setQueue(queue());
    document.querySelectorAll('.tab').forEach(function (t) { t.onclick = function () { TAB = t.dataset.t; render(); }; });
    document.getElementById('testBtn').onclick = testPrint;
    var code = codeFrom(new URLSearchParams(location.search).get('code') || '');
    var go = function () { if (code) { SEL = ROWS.find(function (x) { return x.code === code; }) || null; } render(); };
    if (offline) { setOnline(false); go(); }
    else load().then(go);
    // 다른 데스크가 한 일을 20초마다 반영(입력 중이면 미룬다), 대기열은 10초마다 다시 시도
    setInterval(function () {
      var a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.id !== 'q';
      if (!typing && !document.querySelector('.modal') && sb) flush().then(function () { if (!queue().length) load(true); });
    }, 20000);
    setInterval(function () { if (queue().length && sb) flush(); }, 10000);
    window.addEventListener('online', function () { if (sb) flush(); });
    window.addEventListener('offline', function () { setOnline(false); });
    window.addEventListener('beforeunload', function (e) { if (queue().length) { e.preventDefault(); e.returnValue = ''; } });
  }
  document.getElementById('logout').onclick = function () { if (queue().length && !confirm('아직 서버에 못 올린 기록이 ' + queue().length + '건 있습니다. 로그아웃해도 이 PC에는 남습니다.')) return; DB.logout().then(function () { renderLogin(); }); };
  boot();
})();
</script>
