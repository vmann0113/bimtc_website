    agree: 'Би хувийн мэдээллээ цуглуулж, ашиглахыг зөвшөөрч байна.',
    submit: 'Өргөдөл илгээх', sending: 'Илгээж байна…',
    err_req: 'Заавал бөглөх талбарыг бөглөнө үү.', err_email: 'Зөв и-мэйл хаяг оруулна уу.',
    err_email2: 'И-мэйл хаяг таарахгүй байна.', err_agree: 'Зөвшөөрлөө өгнө үү.',
    err_send: 'Илгээж чадсангүй. Сүлжээгээ шалгаад дахин оролдоно уу.',
    done_t: 'Өргөдөл хүлээн авлаа', done_new: 'Баярлалаа. Нарийн бичгийн газар хянаад танд имэйлээр хариу өгнө.',
    done_upd: 'Баярлалаа. Өмнөх өргөдлийг тань энэ мэдээллээр шинэчиллээ.',
    done_mail: 'Асуулт:', again: 'Дахин өргөдөл илгээх'
  };

  var SEC_MAIL = 'bmia0528@naver.com';
  var app = document.getElementById('app');
  var lang = (function () {
    var m = (location.search || '').match(/[?&]lang=(en|zh|ru|mn)/);
    if (m) return m[1];
    try { var v = localStorage.getItem('bimtc_apply_lang'); if (v && T[v]) return v; } catch (e) {}
    var n = (navigator.language || 'en').toLowerCase();
    if (n.indexOf('zh') === 0) return 'zh';
    if (n.indexOf('ru') === 0) return 'ru';
    if (n.indexOf('mn') === 0) return 'mn';
    return 'en';
  })();
  var form = { attend_mode: 'online' };
  var sending = false, errKey = '', badSet = {};

  function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function renderLangs() {
    var box = document.getElementById('langs');
    box.innerHTML = LANGS.map(function (l) {
      return '<button type="button" data-l="' + l[0] + '" class="' + (l[0] === lang ? 'on' : '') + '">' + l[1] + '</button>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
      b.onclick = function () {
        lang = b.getAttribute('data-l');
        try { localStorage.setItem('bimtc_apply_lang', lang); } catch (e) {}
        document.documentElement.setAttribute('lang', lang);
        renderLangs(); render();
      };
    });
  }

  // 한 칸 그리기
  function field(key, labelKey, opt) {
    opt = opt || {};
    var req = !!opt.req, ph = opt.ph ? t(opt.ph) : '', hint = opt.hint ? t(opt.hint) : '';
    return '<div class="f' + (opt.full ? ' full' : '') + (badSet[key] ? ' bad' : '') + '">'
      + '<label class="l" for="f_' + key + '">' + esc(t(labelKey)) + (req ? '<span class="r">*</span>' : '') + '</label>'
      + (opt.area
        ? '<textarea id="f_' + key + '" data-k="' + key + '" placeholder="' + esc(ph) + '">' + esc(form[key] || '') + '</textarea>'
        : '<input id="f_' + key + '" data-k="' + key + '" type="' + (opt.type || 'text') + '" value="' + esc(form[key] || '') + '" placeholder="' + esc(ph) + '" autocomplete="' + (opt.ac || 'on') + '" />')
      + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '')
      + '</div>';
  }

  function render() {
    var modes = [['online', 'm_online'], ['onsite', 'm_onsite'], ['both', 'm_both']];
    app.innerHTML =
      '<div class="hero">'
      + '<div class="sub">' + esc(t('sub')) + '</div>'
      + '<h1>' + esc(t('title')) + '</h1>'
      + '<div class="ev">' + esc(t('ev')) + '</div>'
      + '<div class="for">' + esc(t('badge')) + '</div>'
      + '<p>' + esc(t('intro')) + '</p>'
      + '<div class="req-note">' + esc(t('req_note')) + '</div>'
      + '</div>'

      + '<section class="card"><h2>' + esc(t('s_you')) + '</h2><div class="grid">'
      + field('last_name', 'last', { req: true, ph: 'last_ph', ac: 'family-name' })
      + field('first_name', 'first', { req: true, ph: 'first_ph', ac: 'given-name' })
      + field('country', 'country', { req: true, ph: 'country_ph', ac: 'country-name' })
      + field('company', 'company', { req: true, ph: 'company_ph', ac: 'organization' })
      + field('industry', 'industry', { ph: 'industry_ph' })
      + field('job_title', 'job', { ph: 'job_ph', ac: 'organization-title' })
      + field('dept', 'dept', { ph: 'dept_ph' })
      + '</div></section>'

      + '<section class="card"><h2>' + esc(t('s_contact')) + '</h2><div class="grid">'
      + field('email', 'email', { req: true, ph: 'email_ph', type: 'email', ac: 'email', hint: 'h_email' })
      + field('email2', 'email2', { req: true, ph: 'email_ph', type: 'email', ac: 'off' })
      + field('phone', 'mobile', { type: 'tel', ac: 'tel', hint: 'h_mobile' })
      + field('landline', 'landline', { type: 'tel' })
      + '</div></section>'

      + '<section class="card"><h2>' + esc(t('s_meet')) + '</h2><div class="grid">'
      + '<div class="f full"><label class="l">' + esc(t('mode')) + '<span class="r">*</span></label>'
      + '<div class="mode">' + modes.map(function (m) {
          return '<button type="button" data-m="' + m[0] + '" class="' + (form.attend_mode === m[0] ? 'on' : '') + '">' + esc(t(m[1])) + '</button>';
        }).join('') + '</div>'
      + '<div class="hint">' + esc(t('h_mode')) + '</div></div>'
      + field('interests', 'interests', { full: true, area: true, ph: 'interests_ph', hint: 'h_interests' })
      + '</div></section>'

      + '<section class="card">'
      + '<div class="consent' + (badSet.agree ? ' bad' : '') + '"><b>' + esc(t('consent_t')) + '</b>' + esc(t('consent_b'))
      + '<label class="agree"><input type="checkbox" id="f_agree"' + (form.agree ? ' checked' : '') + ' /> ' + esc(t('agree')) + '</label></div>'
      + '<div class="hp"><label>Company website<input type="text" id="f_hp" tabindex="-1" autocomplete="off" /></label></div>'
      + '<div class="actions"><button class="btn" id="go"' + (sending ? ' disabled' : '') + '>' + esc(t(sending ? 'sending' : 'submit')) + '</button></div>'
      + (errKey ? '<div class="msg err">' + esc(t(errKey)) + '</div>' : '')
      + '</section>'

      + '<footer>BIMTC 2026 Secretariat · ' + SEC_MAIL + '</footer>';

    Array.prototype.forEach.call(app.querySelectorAll('[data-k]'), function (el) {
      el.oninput = function () { form[el.getAttribute('data-k')] = el.value; };
    });
    Array.prototype.forEach.call(app.querySelectorAll('.mode button'), function (b) {
      b.onclick = function () { form.attend_mode = b.getAttribute('data-m'); render(); };
    });
    document.getElementById('f_agree').onchange = function (e) { form.agree = e.target.checked; };
    document.getElementById('go').onclick = submit;
  }

  function done(updated) {
    app.innerHTML = '<section class="card"><div class="center">'
      + '<div class="done-ic">✓</div>'
      + '<h1 style="font-size:20px;margin:0 0 8px;">' + esc(t('done_t')) + '</h1>'
      + '<p style="color:#33485e;margin:0 auto;max-width:460px;">' + esc(t(updated ? 'done_upd' : 'done_new')) + '</p>'
      + '<p class="muted" style="margin-top:16px;">' + esc(t('done_mail')) + ' ' + SEC_MAIL + '</p>'
      + '<div class="actions" style="max-width:320px;margin:22px auto 0;"><button class="btn ghost" id="again">' + esc(t('again')) + '</button></div>'
      + '</div></section>';
    document.getElementById('again').onclick = function () {
      form = { attend_mode: 'online' }; errKey = ''; badSet = {};
      render(); window.scrollTo(0, 0);
    };
    window.scrollTo(0, 0);
  }

  function submit() {
    if (sending) return;
    var mail = (form.email || '').trim(), mail2 = (form.email2 || '').trim();
    badSet = {}; errKey = '';
    ['last_name', 'first_name', 'country', 'company', 'email'].forEach(function (k) {
      if (!(form[k] || '').trim()) { badSet[k] = 1; errKey = errKey || 'err_req'; }
    });
    if (!errKey && !/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(mail)) { badSet.email = 1; errKey = 'err_email'; }
    if (!errKey && mail.toLowerCase() !== mail2.toLowerCase()) { badSet.email2 = 1; errKey = 'err_email2'; }
    if (!errKey && !form.agree) { badSet.agree = 1; errKey = 'err_agree'; }
    // 자동 등록 거르기 — 사람 눈에 안 보이는 칸이 채워져 있으면 받은 척만 한다
    var hp = document.getElementById('f_hp');
    if (!errKey && hp && hp.value) { done(false); return; }
    if (errKey) {
      render();
      var first = app.querySelector('.f.bad input, .f.bad textarea') || app.querySelector('.consent.bad');
      if (first && first.scrollIntoView) first.scrollIntoView({ block: 'center' });
      if (first && first.focus) try { first.focus(); } catch (e) {}
      return;
    }

    sending = true; render();
    var body = {
      last_name: form.last_name, first_name: form.first_name, country: form.country,
      company: form.company, industry: form.industry, job_title: form.job_title, dept: form.dept,
      email: mail, phone: form.phone, landline: form.landline,
      attend_mode: form.attend_mode, interests: form.interests, lang: lang
    };
    fetch(SUPABASE_URL + '/rest/v1/rpc/online_buyer_apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify({ p: body })
    }).then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (res) {
        sending = false;
        if (res && res.ok) { done(!!res.updated); return; }
        errKey = (res && res.error === 'email') ? 'err_email' : (res && res.error === 'missing') ? 'err_req' : 'err_send';
        if (res && res.error === 'missing' && res.field) badSet[res.field] = 1;
        render();
      })
      .catch(function () { sending = false; errKey = 'err_send'; render(); });
  }

  document.documentElement.setAttribute('lang', lang);
  renderLangs();
  render();
})();
</script>
</body>
</html>
