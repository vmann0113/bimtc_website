<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화상 미팅 · BIMTC 2026</title>
<meta name="description" content="BIMTC 2026 비즈니스 매칭 화상 미팅.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A2236">
<link rel="icon" type="image/png" href="uploads/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#0A1620;color:#fff;font-family:'Pretendard',-apple-system,sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{display:flex;flex-direction:column;height:100%;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px clamp(12px,3vw,22px);background:#07111A;border-bottom:1px solid rgba(255,255,255,0.08);}
  .ttl{font-size:15px;font-weight:800;}
  .sub{font-size:12.5px;color:#8fa3b5;}
  .pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,0.1);color:#cfe0ee;white-space:nowrap;}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vw,18px);min-height:0;}
  #remote{width:100%;height:100%;object-fit:contain;background:#07111A;border-radius:14px;}
  #local{position:absolute;right:clamp(14px,3vw,28px);bottom:clamp(14px,3vw,28px);width:clamp(120px,22vw,220px);aspect-ratio:4/3;object-fit:cover;background:#12212E;border:2px solid rgba(255,255,255,0.18);border-radius:12px;transform:scaleX(-1);}
  .note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:460px;padding:0 20px;}
  .note h2{font-size:19px;font-weight:800;margin:0 0 8px;}
  .note p{font-size:14px;color:#9fb4c7;line-height:1.7;margin:0;}
  .ctrl{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px clamp(12px,3vw,22px) calc(14px + env(safe-area-inset-bottom));background:#07111A;border-top:1px solid rgba(255,255,255,0.08);}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:11px;padding:13px 18px;font-size:14px;font-weight:700;background:rgba(255,255,255,0.12);color:#fff;}
  .btn.off{background:#C0392B;}
  .btn.go{background:#11A37B;}
  .btn.end{background:#C0392B;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .gate{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;}
  .card{background:#0F2030;border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:clamp(22px,4vw,34px);max-width:460px;width:100%;text-align:center;}
  .card h1{font-size:20px;font-weight:800;margin:0 0 10px;}
  .card p{font-size:14px;color:#9fb4c7;line-height:1.7;margin:0 0 20px;}
  a.home{color:#8fa3b5;font-size:13px;text-decoration:none;}
  @media (max-width:640px){ #local{width:104px;} .btn{padding:12px 14px;font-size:13px;} }
</style>
</head>
<body>
<div id="app" class="gate"><div class="card"><h1>미팅을 불러오는 중입니다…</h1><p>잠시만 기다려 주세요.</p></div></div>
<script src="bimtc-config.js"></script>
<script src="bimtc-supabase.js"></script>
<script src="meet.js"></script>
</body>
</html>
