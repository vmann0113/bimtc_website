  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    function save(ok) {
      var p = collect(); if (ok) p.reviewed_at = new Date().toISOString();
      sb.from('buyer_invites').update(p).eq('id', r.id).select().then(function (res) {
        if (res.error) { toast('저장 실패: ' + res.error.message); return; }
        closeModal(); toast(ok ? '저장하고 확인완료로 표시했습니다' : '저장했습니다'); load();
      });
    }
    m.querySelector('#dSave').onclick = function () { save(false); };
    var ok = m.querySelector('#dOk'); if (ok) ok.onclick = function () { save(true); };
    m.querySelector('#dMail').onclick = function () { openMail(r); };
    m.querySelector('#dDel').onclick = function () {
      if (!confirm(label(r) + ' 바이어를 삭제할까요? 입력한 정보와 개인 링크가 모두 사라지며 되돌릴 수 없습니다.')) return;
      sb.from('buyer_invites').delete().eq('id', r.id).then(function (res) {
        if (res.error) { toast('삭제 실패: ' + res.error.message); return; }
        delete SEL[r.id]; closeModal(); toast('삭제했습니다'); load();
      });
    };
  }

  // ───────── 표 정의 (엑셀·인쇄 공용) ─────────
  var COLS = {
    all: [
      ['상태', function (r) { return STATUS[status(r)]; }, 12], ['국가', 'country', 12], ['기업/기관', 'company', 24], ['직함', 'job_title', 14],
      ['여권 영문명', 'passport_name', 22], ['성별', function (r) { return v(r.gender); }, 6], ['이메일', 'email', 26], ['휴대전화', 'mobile', 18], ['메신저', 'messenger', 18],
      ['동반자 수', function (r) { return +r.companions || 0; }, 8], ['동반자 이름', 'companion_names', 22],
      ['입국일', 'arrival_date', 11], ['도착시간', function (r) { return hm(r.arrival_time); }, 8], ['입국 편명', 'arrival_flight', 10], ['도착공항', function (r) { return v(r.arrival_airport); }, 11], ['터미널', 'arrival_terminal', 7],
      ['출국일', 'departure_date', 11], ['출발시간', function (r) { return hm(r.departure_time); }, 8], ['출국 편명', 'departure_flight', 10], ['출발공항', function (r) { return v(r.departure_airport); }, 11],
      ['체크인', 'checkin_date', 11], ['체크아웃', 'checkout_date', 11], ['숙박', function (r) { return v(r.hotel_type); }, 11], ['공항 픽업', function (r) { return v(r.pickup); }, 9],
      ['팸투어', function (r) { return v(r.fam_tour); }, 8], ['B2B', function (r) { return v(r.b2b); }, 8],
      ['비자 필요', function (r) { return v(r.visa_needed); }, 9], ['여권번호', 'passport_no', 13], ['생년월일', 'birth_date', 11],
      ['식이', function (r) { return v(r.dietary); }, 8], ['알레르기/식이 상세', 'dietary_note', 24], ['통역', function (r) { return v(r.interpreter); }, 6], ['통역 언어', 'interpreter_lang', 10],
      ['기타 요청', 'requests', 30], ['관리자 메모', 'memo', 24], ['폼 언어', function (r) { return LANG_KO[r.lang] || r.lang; }, 8],
      ['최초 제출', function (r) { return r.submitted_at ? new Date(r.submitted_at).toLocaleString() : ''; }, 18],
      ['바이어 최종 수정', function (r) { return r.buyer_updated_at ? new Date(r.buyer_updated_at).toLocaleString() : ''; }, 18],
      ['개인 링크', function (r) { return link(r); }, 40]
    ],
    pickup: [
      ['입국일', 'arrival_date', 11], ['도착시간', function (r) { return hm(r.arrival_time); }, 8], ['편명', 'arrival_flight', 10], ['공항', function (r) { return v(r.arrival_airport); }, 11], ['터미널', 'arrival_terminal', 7],
      ['여권 영문명', 'passport_name', 22], ['인원', people, 6], ['동반자', 'companion_names', 20], ['국가', 'country', 11], ['기업/기관', 'company', 22],
      ['휴대전화', 'mobile', 17], ['메신저', 'messenger', 16], ['출국일', 'departure_date', 11], ['출국 편명', 'departure_flight', 10], ['출발시간', function (r) { return hm(r.departure_time); }, 8]
    ],
    rooms: [
      ['체크인', 'checkin_date', 11], ['체크아웃', 'checkout_date', 11], ['박수', nights, 6], ['숙박', function (r) { return v(r.hotel_type); }, 11],
      ['여권 영문명', 'passport_name', 22], ['성별', function (r) { return v(r.gender); }, 6], ['인원', people, 6], ['동반자', 'companion_names', 22],
      ['국가', 'country', 11], ['기업/기관', 'company', 22], ['휴대전화', 'mobile', 17], ['식이', function (r) { return v(r.dietary); }, 8], ['요청사항', 'requests', 26]
    ],
    diet: [
      ['여권 영문명', 'passport_name', 22], ['국가', 'country', 11], ['기업/기관', 'company', 22], ['인원', people, 6],
      ['식이', function (r) { return v(r.dietary); }, 8], ['알레르기/식이 상세', 'dietary_note', 30], ['통역', function (r) { return v(r.interpreter); }, 6], ['통역 언어', 'interpreter_lang', 12]
    ]
  };
  function cell(c, r) { var x = typeof c[1] === 'function' ? c[1](r) : r[c[1]]; return x == null ? '' : x; }
  function sets(list) {
    return {
      all: list,
      pickup: list.filter(function (r) { return r.pickup === 'yes'; }).sort(byArrival),
      rooms: list.filter(function (r) { return r.hotel_type || r.checkin_date; }).sort(function (a, b) { return String(a.checkin_date || '9999').localeCompare(String(b.checkin_date || '9999')); }),
      diet: list.filter(function (r) { return hasDiet(r) || r.interpreter === 'yes'; })
    };
  }
  var TITLES = { all: '전체 명단', pickup: '공항 픽업', rooms: '숙박 룸리스트', diet: '식이 · 통역' };

  // ───────── 엑셀 ─────────
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function (ok, no) {
      var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload = function () { ok(window.XLSX); }; s.onerror = no; document.head.appendChild(s);
    });
  }
  function exportXlsx() {
    var list = filtered();
    if (!list.length) { toast('내보낼 바이어가 없습니다'); return; }
    var btn = document.getElementById('xlsB'); btn.disabled = true; btn.textContent = '만드는 중…';
    loadXlsx().then(function (X) {
      var wb = X.utils.book_new(), S = sets(list);
      ['all', 'pickup', 'rooms', 'diet'].forEach(function (k) {
        var cols = COLS[k];
        var aoa = [cols.map(function (c) { return c[0]; })].concat(S[k].map(function (r) { return cols.map(function (c) { return cell(c, r); }); }));
        var ws = X.utils.aoa_to_sheet(aoa);
        ws['!cols'] = cols.map(function (c) { return { wch: c[2] || 12 }; });
        ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(aoa.length - 1, 0), c: cols.length - 1 } }) };
        X.utils.book_append_sheet(wb, ws, TITLES[k].replace(/[\\\/?*\[\]:]/g, ''));
      });
      X.writeFile(wb, 'BIMTC2026_초청바이어_' + stamp().replace(/[-: ]/g, '').replace(/^(\d{8})(\d{4})$/, '$1_$2') + '.xlsx');
      toast(list.length + '명 · 엑셀 4개 시트로 내보냈습니다');
    }).catch(function () { toast('엑셀 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); })
      .then(function () { btn.disabled = false; btn.textContent = '엑셀 다운로드'; });
  }

  // ───────── 인쇄 ─────────
  function prHead(title, n) {
    return '<div class="pr-hd"><b>2026 BIMTC 초청바이어 · ' + esc(title) + '</b><span>' + n + '명 · 출력 ' + stamp() + '</span></div>';
  }
  function prTable(cols, rows) {
    return '<table class="p"><thead><tr><th>No</th>' + cols.map(function (c) { return '<th>' + esc(c[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td>' + cols.map(function (c) { return '<td>' + esc(cell(c, r)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
  }
  var LIST_COLS = [
    ['상태', function (r) { return STATUS[status(r)]; }], ['국가', 'country'], ['기업/기관', 'company'], ['여권 영문명', 'passport_name'], ['인원', people],
    ['입국', function (r) { return [md(r.arrival_date), hm(r.arrival_time), r.arrival_flight, v(r.arrival_airport), r.arrival_terminal].filter(Boolean).join(' '); }],
    ['출국', function (r) { return [md(r.departure_date), hm(r.departure_time), r.departure_flight, v(r.departure_airport)].filter(Boolean).join(' '); }],
    ['픽업', function (r) { return v(r.pickup); }], ['숙박', function (r) { return [v(r.hotel_type), md(r.checkin_date) + (r.checkout_date ? '~' + md(r.checkout_date) : '')].filter(Boolean).join(' '); }],
    ['팸/B2B', function (r) { return (v(r.fam_tour) || '-') + '/' + (v(r.b2b) || '-'); }],
    ['식이', function (r) { return [v(r.dietary), r.dietary_note].filter(Boolean).join(' · '); }], ['통역', function (r) { return r.interpreter === 'yes' ? (r.interpreter_lang || '예') : ''; }],
    ['연락처', function (r) { return [r.mobile, r.messenger].filter(Boolean).join(' / '); }]
  ];
  function card(r) {
    function row(k, x) { return '<tr><th>' + k + '</th><td>' + esc(x || '') + '</td></tr>'; }
    return '<div class="card-p">' + prHead('바이어 상세', 1).replace('1명 · ', '') +
      '<h2>' + esc(r.passport_name || '(여권명 미입력)') + ' <span style="font-size:12pt;font-weight:400">' + esc(v(r.gender)) + '</span></h2>' +
      '<div class="co">' + esc([r.country, r.company, r.job_title].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="pr-sec">연락처</div><table class="kv">' + row('휴대전화', r.mobile) + row('메신저', r.messenger) + row('이메일', r.email) + row('동반자', (+r.companions || 0) + '명 ' + (r.companion_names || '')) + '</table>' +
      '<div class="pr-sec">항공</div><table class="kv">' +
        row('입국', [r.arrival_date, hm(r.arrival_time), r.arrival_flight, v(r.arrival_airport), r.arrival_terminal].filter(Boolean).join('  ')) +
        row('출국', [r.departure_date, hm(r.departure_time), r.departure_flight, v(r.departure_airport)].filter(Boolean).join('  ')) + row('공항 픽업', v(r.pickup)) + '</table>' +
      '<div class="pr-sec">숙박 · 행사</div><table class="kv">' +
        row('숙박', [v(r.hotel_type), r.checkin_date ? r.checkin_date + ' ~ ' + (r.checkout_date || '') : '', nights(r)].filter(Boolean).join('  ')) +
        row('팸투어', v(r.fam_tour)) + row('B2B 상담회', v(r.b2b)) + row('비자', [v(r.visa_needed), r.passport_no, r.birth_date].filter(Boolean).join('  ')) + '</table>' +
      '<div class="pr-sec">기타</div><table class="kv">' +
        row('식이 / 알레르기', [v(r.dietary), r.dietary_note].filter(Boolean).join(' · ')) + row('통역', r.interpreter === 'yes' ? '필요 · ' + (r.interpreter_lang || '') : v(r.interpreter)) +
        row('기타 요청', r.requests) + row('관리자 메모', r.memo) + '</table></div>';
  }
  function doPrint(kind) {
    var list = filtered(), S = sets(list), html, landscape = true;
    if (kind === 'list') html = prHead('목록', list.length) + prTable(LIST_COLS, list.slice().sort(byArrival));
    else if (kind === 'cards') {
      // 선택한 바이어만. 선택이 없으면 목록 중 입력을 마친 바이어만 (빈 카드 출력 방지)
      var pick = list.filter(function (r) { return SEL[r.id]; });
      if (!pick.length) pick = list.filter(function (r) { return r.submitted_at; });
      html = pick.slice().sort(byArrival).map(card).join(''); landscape = false; list = pick;
    } else html = prHead(TITLES[kind], S[kind].reduce(function (s, r) { return s + people(r); }, 0)) + prTable(COLS[kind], S[kind]);
    if (!list.length || (kind !== 'list' && kind !== 'cards' && !S[kind].length)) { toast('인쇄할 대상이 없습니다'); return; }
    document.getElementById('pageSize').textContent = '@page{size:A4 ' + (landscape ? 'landscape' : 'portrait') + ';margin:12mm;}';
    document.getElementById('print').innerHTML = html;
    setTimeout(function () { window.print(); }, 50);
  }

  boot();
})();
</script>
</body>
</html>
