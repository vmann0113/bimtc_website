      ap_PUS: 'Пусан Гимхэ (PUS)', ap_ICN: 'Сөүл Инчон (ICN)', ap_GMP: 'Сөүл Гимпо (GMP)', ap_OTHER: 'Бусад', ap_other_ph: 'Нисэх буудлын нэр', select: 'Сонгох',
      checkin_date: 'Буудалд орох өдөр', checkout_date: 'Буудлаас гарах өдөр',
      hotel_type: 'Байрлах газар', o_provided: 'Зохион байгуулагчийн зочид буудал', o_own: 'Өөрөө захиална',
      pickup: 'Нисэх буудлаас тосох шаардлагатай юу?', o_yes: 'Тийм', o_no: 'Үгүй', o_undecided: 'Шийдээгүй', o_unsure: 'Мэдэхгүй',
      fam_tour: 'Танилцах аялал (чуулганы дараа өдөр)', b2b: 'B2B бизнес уулзалт',
      visa_needed: 'Солонгост нэвтрэхэд виз шаардлагатай юу?', h_visa: 'Шаардлагатай бол бид урилга бэлтгэнэ — паспортын мэдээллээ доор бөглөнө үү.',
      passport_no: 'Паспортын дугаар', birth_date: 'Төрсөн огноо',
      dietary: 'Хоолны онцлог', o_none: 'Байхгүй', o_vegetarian: 'Цагаан хоол', o_vegan: 'Веган', o_halal: 'Халал', o_other: 'Бусад',
      dietary_note: 'Харшил / дэлгэрэнгүй', interpreter: 'Орчуулагч хэрэгтэй юу?', interpreter_lang: 'Хэл', h_interp: 'жишээ нь монгол хэл',
      requests: 'Бусад хүсэлт',
      consent_title: 'Хувийн мэдээлэл цуглуулах, ашиглахыг зөвшөөрөх',
      consent_body: 'Зорилго: BIMTC 2026-д урих, нислэг, тосох, байр, хөтөлбөрийг зохион байгуулах. Мэдээлэл: энэ маягтад бөглөсөн мэдээлэл. Хадгалах хугацаа: арга хэмжээний тооцоо дууссаны дараа устгана. Та татгалзаж болно, гэхдээ энэ тохиолдолд урилгын дэмжлэг үзүүлэх боломжгүй байж магадгүй.',
      consent_agree: 'Би зөвшөөрч байна', submit: 'Илгээх', update: 'Өөрчлөлтийг хадгалах', saving: 'Хадгалж байна…',
      err_req: 'Заавал бөглөх талбаруудыг бөглөнө үү.', err_consent: 'Хувийн мэдээллийн зөвшөөрлийг тэмдэглэнэ үү.', err_net: 'Хадгалж чадсангүй. Интернэт холболтоо шалгаад дахин оролдоно уу.', err_link: 'Холбоос хүчингүй байна. BIMTC-ийн нарийн бичгийн газартай холбогдоно уу.',
      loading: 'Ачаалж байна…', done_title: 'Баярлалаа!', done_body: 'Таны мэдээлэл хадгалагдлаа. Энэ холбоосоор орж хэдийд ч засах боломжтой.', edit: 'Хариултаа засах', last_saved: 'Сүүлд хадгалсан',
      contact: 'Асуулт: BIMTC нарийн бичгийн газар · bmia0528@naver.com · +82-51-461-4276'
    }
  };

  // 폼 구성. show: 조건부 표시, req: 필수(PDF 굵은 항목 기준)
  var YN = ['yes', 'no'], YNU = ['yes', 'no', 'undecided'];
  var SECTIONS = [
    { k: 's_basic', fields: [
      { k: 'passport_name', type: 'text', req: 1, hint: 'h_passport_name', full: 1, upper: 1 },
      { k: 'gender', type: 'radio', req: 1, opts: ['male', 'female'] },
      { k: 'country', type: 'text', req: 1 },
      { k: 'company', type: 'text' },
      { k: 'job_title', type: 'text' },
      { k: 'email', type: 'email' },
      { k: 'mobile', type: 'tel', hint: 'h_mobile' },
      { k: 'messenger', type: 'text', hint: 'h_messenger' },
      { k: 'companions', type: 'number' },
      { k: 'companion_names', type: 'textarea', full: 1, show: function (d) { return +d.companions > 0; } }
    ] },
    { k: 's_flight', fields: [
      { k: 'arrival_date', type: 'date', req: 1 },
      { k: 'arrival_time', type: 'time', req: 1 },
      { k: 'arrival_flight', type: 'text', req: 1, hint: 'h_flight', upper: 1 },
      { k: 'arrival_airport', type: 'airport', req: 1 },
      { k: 'arrival_terminal', type: 'radio', opts: ['T1', 'T2'], raw: 1, show: function (d) { return d.arrival_airport === 'ICN'; } },
      { k: 'departure_date', type: 'date', req: 1 },
      { k: 'departure_time', type: 'time', req: 1 },
      { k: 'departure_flight', type: 'text', req: 1, hint: 'h_flight', upper: 1 },
      { k: 'departure_airport', type: 'airport', req: 1 }
    ] },
    { k: 's_stay', fields: [
      { k: 'checkin_date', type: 'date' },
      { k: 'checkout_date', type: 'date' },
      { k: 'hotel_type', type: 'radio', opts: ['provided', 'own'], full: 1 },
      { k: 'pickup', type: 'radio', req: 1, opts: YN, full: 1 }
    ] },
    { k: 's_program', fields: [
      { k: 'fam_tour', type: 'radio', opts: YNU, full: 1 },
      { k: 'b2b', type: 'radio', opts: YNU, full: 1 }
    ] },
    { k: 's_visa', fields: [
      { k: 'visa_needed', type: 'radio', opts: ['yes', 'no', 'unsure'], full: 1, hint: 'h_visa' },
      { k: 'passport_no', type: 'text', upper: 1, show: function (d) { return d.visa_needed === 'yes'; } },
      { k: 'birth_date', type: 'date', show: function (d) { return d.visa_needed === 'yes'; } }
    ] },
    { k: 's_other', fields: [
      { k: 'dietary', type: 'radio', req: 1, opts: ['none', 'vegetarian', 'vegan', 'halal', 'other'], full: 1 },
      { k: 'dietary_note', type: 'textarea', full: 1 },
      { k: 'interpreter', type: 'radio', opts: YN },
      { k: 'interpreter_lang', type: 'text', hint: 'h_interp', show: function (d) { return d.interpreter === 'yes'; } },
      { k: 'requests', type: 'textarea', full: 1 }
    ] }
  ];
  var AIRPORTS = ['PUS', 'ICN', 'GMP'];

  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var lang = 'en', D = {}, consent = false, loaded = null, busy = false;
  var app = document.getElementById('app');

  function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function rpc(fn, body) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
        if (!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function renderLangs() {
    document.getElementById('langs').innerHTML = LANGS.map(function (l) {
      return '<button type="button" data-l="' + l[0] + '" class="' + (l[0] === lang ? 'on' : '') + '">' + l[1] + '</button>';
    }).join('');
    document.documentElement.lang = lang;
    document.title = t('title') + ' · BIMTC 2026';
  }
  document.getElementById('langs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-l]'); if (!b) return;
    lang = b.getAttribute('data-l'); store('bimtc_invite_lang', lang);
    renderLangs();
    if (loaded) (app.getAttribute('data-view') === 'done' ? renderDone() : renderForm());
  });

  function fieldHtml(f) {
    var v = D[f.k] == null ? '' : D[f.k];
    var lab = '<label class="l" for="f_' + f.k + '">' + esc(t(f.k)) + (f.req ? '<span class="r">*</span>' : '') + '</label>';
    var ctl = '';
    if (f.type === 'radio') {
      ctl = '<div class="opts" role="radiogroup">' + f.opts.map(function (o) {
        var on = String(v) === o;
        return '<label class="' + (on ? 'on' : '') + '"><input type="radio" name="' + f.k + '" value="' + o + '"' + (on ? ' checked' : '') + '>' + esc(f.raw ? o : t('o_' + o)) + '</label>';
      }).join('') + '</div>';
    } else if (f.type === 'airport') {
      var isOther = v && AIRPORTS.indexOf(v) < 0;
      ctl = '<select id="f_' + f.k + '" data-k="' + f.k + '" data-ap="1"><option value="">' + esc(t('select')) + '</option>' +
        AIRPORTS.concat(['OTHER']).map(function (a) {
          var sel = (a === 'OTHER') ? isOther : v === a;
          return '<option value="' + a + '"' + (sel ? ' selected' : '') + '>' + esc(t('ap_' + a)) + '</option>';
        }).join('') + '</select>' +
        '<input type="text" data-k="' + f.k + '" data-apo="1" placeholder="' + esc(t('ap_other_ph')) + '" value="' + esc(isOther ? v : '') + '" style="margin-top:8px;"' + (isOther ? '' : ' hidden') + '>';
    } else if (f.type === 'textarea') {
      ctl = '<textarea id="f_' + f.k + '" data-k="' + f.k + '">' + esc(v) + '</textarea>';
    } else {
      var extra = f.type === 'number' ? ' min="0" max="20" inputmode="numeric"' : '';
      if (f.upper) extra += ' autocapitalize="characters" style="text-transform:uppercase"';
      ctl = '<input id="f_' + f.k + '" data-k="' + f.k + '" type="' + f.type + '" value="' + esc(v) + '"' + extra + '>';
    }
    var hint = f.hint ? '<div class="hint">' + esc(t(f.hint)) + '</div>' : '';
    var hide = f.show && !f.show(D);
    return '<div class="f' + (f.full ? ' full' : '') + '" data-f="' + f.k + '"' + (hide ? ' hidden' : '') + '>' + lab + ctl + hint + '</div>';
  }

  function renderForm() {
    app.setAttribute('data-view', 'form');
    var html = '<div class="hero"><p class="sub">' + esc(t('sub')) + '</p><h1>' + esc(t('title')) + '</h1><p class="ev">' + esc(t('ev')) + '</p>' +
      (loaded.company ? '<div class="for">' + esc(loaded.company) + '</div>' : '') +
      '<p>' + esc(t('intro')) + '</p><div class="req-note">' + esc(t('req_note')) + '</div></div>';
    SECTIONS.forEach(function (s) {
      html += '<section class="card"><h2>' + esc(t(s.k)) + '</h2><div class="grid">' + s.fields.map(fieldHtml).join('') + '</div></section>';
    });
    html += '<section class="card"><div class="consent" id="consentBox"><b>' + esc(t('consent_title')) + '</b>' + esc(t('consent_body')) +
      '<label class="agree"><input type="checkbox" id="consent"' + (consent ? ' checked' : '') + '>' + esc(t('consent_agree')) + '<span style="color:#c0392b">*</span></label></div>' +
      '<div class="actions"><button type="button" class="btn" id="submit">' + esc(loaded.submitted_at ? t('update') : t('submit')) + '</button>' +
      '<div id="err"></div></div></section>' +
      '<footer>' + esc(t('contact')) + '</footer>';
    app.innerHTML = html;
  }

  function refreshVisibility() {
    SECTIONS.forEach(function (s) { s.fields.forEach(function (f) {
      if (!f.show) return;
      var el = app.querySelector('[data-f="' + f.k + '"]'); if (el) el.hidden = !f.show(D);
    }); });
  }

  app.addEventListener('input', onChange);
  app.addEventListener('change', onChange);
  function onChange(e) {
    var el = e.target;
    if (el.id === 'consent') { consent = el.checked; document.getElementById('consentBox').classList.remove('bad'); return; }
    if (el.type === 'radio') {
      D[el.name] = el.value;
      var grp = el.closest('.opts');
      grp.querySelectorAll('label').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
    } else if (el.getAttribute('data-ap')) {
      var k = el.getAttribute('data-k'), other = el.parentNode.querySelector('[data-apo]');
      other.hidden = el.value !== 'OTHER';
      D[k] = el.value === 'OTHER' ? other.value.trim() : el.value;
    } else if (el.getAttribute('data-apo')) {
      D[el.getAttribute('data-k')] = el.value.trim();
    } else if (el.getAttribute('data-k')) {
      D[el.getAttribute('data-k')] = el.value;
    } else return;
    var box = el.closest('.f'); if (box) box.classList.remove('bad');
    refreshVisibility();
  }

  app.addEventListener('click', function (e) {
    if (e.target.id === 'submit') submit();
    if (e.target.id === 'editAgain') { renderForm(); window.scrollTo(0, 0); }
  });

  function submit() {
    if (busy) return;
    var err = document.getElementById('err'); err.innerHTML = '';
    var firstBad = null;
    SECTIONS.forEach(function (s) { s.fields.forEach(function (f) {
      if (!f.req || (f.show && !f.show(D))) return;
      var v = D[f.k];
      if (v == null || String(v).trim() === '') {
        var box = app.querySelector('[data-f="' + f.k + '"]'); box.classList.add('bad'); if (!firstBad) firstBad = box;
      }
    }); });
    if (firstBad) { err.innerHTML = '<div class="msg err">' + esc(t('err_req')) + '</div>'; firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (!consent) { document.getElementById('consentBox').classList.add('bad'); err.innerHTML = '<div class="msg err">' + esc(t('err_consent')) + '</div>'; return; }

    var p = { consent: true, lang: lang };
    SECTIONS.forEach(function (s) { s.fields.forEach(function (f) {
      var v = (f.show && !f.show(D)) ? '' : D[f.k];
      p[f.k] = v == null ? '' : String(v);
    }); });

    busy = true;
    var btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = t('saving');
    rpc('invite_submit', { p_token: token, p: p }).then(function () {
      busy = false;
      loaded.submitted_at = loaded.submitted_at || new Date().toISOString();
      loaded.buyer_updated_at = new Date().toISOString();
      renderDone(); window.scrollTo(0, 0);
    }).catch(function () {
      busy = false; btn.disabled = false; btn.textContent = loaded.submitted_at ? t('update') : t('submit');
      err.innerHTML = '<div class="msg err">' + esc(t('err_net')) + '</div>';
    });
  }

  function renderDone() {
    app.setAttribute('data-view', 'done');
    var when = loaded.buyer_updated_at ? new Date(loaded.buyer_updated_at).toLocaleString() : '';
    app.innerHTML = '<div class="hero center"><div class="done-ic">✓</div><h1>' + esc(t('done_title')) + '</h1><p>' + esc(t('done_body')) + '</p>' +
      (when ? '<p class="muted" style="margin-top:10px">' + esc(t('last_saved')) + ': ' + esc(when) + '</p>' : '') +
      '<div style="max-width:320px;margin:20px auto 0"><button type="button" class="btn ghost" id="editAgain">' + esc(t('edit')) + '</button></div></div>' +
      '<footer>' + esc(t('contact')) + '</footer>';
  }

  function fail() {
    app.innerHTML = '<div class="hero center"><h1 style="font-size:19px">' + esc(t('err_link')) + '</h1><p class="muted" style="margin-top:10px">' + esc(t('contact')) + '</p></div>';
  }

  // 시작
  var urlLang = new URLSearchParams(location.search).get('lang');
  lang = T[urlLang] ? urlLang : (T[recall('bimtc_invite_lang')] ? recall('bimtc_invite_lang') : 'en');
  renderLangs();
  document.getElementById('boot').textContent = t('loading');
  if (!/^[0-9a-f-]{36}$/i.test(token)) { fail(); return; }

  rpc('invite_get', { p_token: token }).then(function (row) {
    if (!row) { fail(); return; }
    loaded = row;
    if (!urlLang && !recall('bimtc_invite_lang') && T[row.lang]) { lang = row.lang; renderLangs(); }
    SECTIONS.forEach(function (s) { s.fields.forEach(function (f) {
      var v = row[f.k];
      if (v == null) return;
      if (f.type === 'time') v = String(v).slice(0, 5);
      D[f.k] = String(v);
    }); });
    consent = !!row.consent_at;
    if (row.submitted_at) renderDone(); else renderForm();
  }).catch(fail);
})();
</script>
</body>
