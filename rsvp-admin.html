<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개막식 회신 관리 · BIMTC 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16294F">
<link rel="icon" type="image/png" href="uploads/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  개막식 참석 회신 관리 (rsvp-admin.html)
  · 기존 관리자(is_admin) 계정으로 로그인. 회신 목록·집계·확인 표시·메모·삭제·엑셀·인쇄.
  · 데이터: public.opening_rsvps (SQL: ../opening_rsvps.sql). 회신 페이지는 rsvp.html.
-->
<script src="bimtc-config.js"></script>
<script src="bimtc-supabase.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EEF1F6;color:#0F2440;font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;font-size:14px;word-break:keep-all}
  input,button,textarea{font-family:inherit}
  .top{position:sticky;top:0;z-index:20;background:#0A2236;color:#fff}
  .top .in{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;padding:12px clamp(14px,4vw,26px)}
  .top h1{font-size:16px;margin:0}
  .top .r{display:flex;gap:10px;align-items:center;font-size:13px;color:#9fb4c7}
  .btn{border:1px solid #c9d4df;background:#fff;color:#0F2440;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.dark{background:#16294F;border-color:#16294F;color:#fff}
  .btn.ghost{background:transparent;color:#cfe0f2;border-color:#3b5470}
  .main{padding:18px clamp(12px,3vw,26px) 40px;max-width:1300px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
  .st{background:#fff;border-radius:12px;padding:14px 16px}
  .st b{display:block;font-size:24px;color:#16294F}
  .st span{color:#6b7f95;font-size:12.5px}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .tools input{border:1px solid #c9d4df;border-radius:8px;padding:8px 11px;min-width:200px;font-size:13px}
  .chip{border:1px solid #c9d4df;background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
  .chip.on{background:#16294F;color:#fff;border-color:#16294F}
  .tw{background:#fff;border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:1050px}
  th,td{padding:9px 10px;border-bottom:1px solid #eef1f5;text-align:left;vertical-align:top}
  th{background:#F6F8FB;color:#4b5d72;font-size:12.5px;position:sticky;top:0;white-space:nowrap}
  td.c{text-align:center}
  .y{color:#11A37B;font-weight:700}.n{color:#B4233C;font-weight:700}
  tr.done td{background:#F4FBF7}
  .memo{width:100%;min-width:130px;border:1px solid #dde4ec;border-radius:6px;padding:5px 7px;font-size:12.5px}
  .empty{padding:40px;text-align:center;color:#6b7f95}
  .gate{max-width:360px;margin:60px auto;background:#fff;border-radius:14px;padding:26px}
  .gate h1{font-size:19px;margin:0 0 4px}
  .gate label{display:block;font-size:12.5px;color:#4b5d72;margin:12px 0 4px}
  .gate input{width:100%;border:1px solid #c9d4df;border-radius:8px;padding:10px}
  .gate .btn{width:100%;margin-top:16px;padding:11px}
  .err{color:#B4233C;margin-top:10px;font-size:13px}
  .link{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
  .link code{background:#F1F4F8;padding:4px 8px;border-radius:6px}
  @media (max-width:760px){
    .tw{background:transparent}
    table{min-width:0}
    thead{display:none}
    tbody tr{display:block;background:#fff;border-radius:12px;margin-bottom:10px;padding:10px 14px}
    tbody td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0;text-align:right}
    tbody td:before{content:attr(data-l);color:#6b7f95;font-size:12.5px;text-align:left;flex:none}
    tbody td.c{text-align:right}
    .memo{max-width:60%}
    .tools input{flex:1 1 100%}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
  @media print{.top,.tools,.link,.noprint{display:none!important}body{background:#fff}.tw{overflow:visible}table{min-width:0;font-size:11px}th{position:static}}
</style>
</head>
<body>
<div class="top"><div class="in"><h1>2026 BIMTC 개막식 참석 회신</h1>
  <div class="r" id="topRight" hidden><span id="who"></span><button class="btn ghost" id="logout">로그아웃</button></div></div></div>
<div class="main" id="view"><div class="empty">불러오는 중…</div></div>
<script>
(function () {
  var DB = window.BimtcDB, sb = null, ROWS = [], F = { q: '', f: '' };
  var view = document.getElementById('view');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function yn(v) { return v === '참석' ? '<span class="y">참석</span>' : v === '불참' ? '<span class="n">불참</span>' : '-'; }
  function dt(s) { var d = new Date(s), p = function (n) { return String(n).padStart(2, '0'); }; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function rsvpLink() { return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'rsvp'; }

  function renderLogin(msg) {
    document.getElementById('topRight').hidden = true;
    view.innerHTML = '<div class="gate"><h1>개막식 회신 관리</h1><p style="color:#8295ab;margin:4px 0 6px">사무국 관리자 계정으로 로그인하세요.</p>' +
      '<label>이메일</label><input id="liE" type="email" autocomplete="username"><label>비밀번호</label><input id="liP" type="password" autocomplete="current-password">' +
      (msg ? '<div class="err">' + esc(msg) + '</div>' : '') + '<button class="btn dark" id="liB">로그인</button></div>';
    function go() {
      var b = document.getElementById('liB'); b.disabled = true; b.textContent = '로그인 중…';
      DB.login(document.getElementById('liE').value.trim(), document.getElementById('liP').value).then(function (r) {
        if (!r.ok) return renderLogin('이메일 또는 비밀번호를 확인해 주세요.');
        boot();
      });
    }
    document.getElementById('liB').onclick = go;
    document.getElementById('liP').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  document.getElementById('logout').onclick = function () { DB.logout().then(function () { renderLogin(); }); };

  function boot() {
    DB.ready().then(function (c) { sb = c; return DB.currentUser(); }).then(function (u) {
      if (!u) return renderLogin();
      if (!u.is_admin) return renderLogin('이 계정은 관리자 권한이 없습니다.');
      document.getElementById('who').textContent = u.name || u.email;
      document.getElementById('topRight').hidden = false;
      load();
    });
  }
  function load() {
    return sb.from('opening_rsvps').select('*').order('created_at', { ascending: true }).then(function (r) {
      if (r.error) { view.innerHTML = '<div class="empty">데이터를 불러오지 못했습니다: ' + esc(r.error.message) + '<br><br>Supabase 에 opening_rsvps.sql 을 실행했는지 확인해 주세요.</div>'; return; }
      ROWS = r.data || []; render();
    });
  }
  function filtered() {
    var q = F.q.trim().toLowerCase();
    return ROWS.filter(function (r) {
      if (F.f === 'att' && r.ceremony !== '참석') return false;
      if (F.f === 'no' && r.ceremony !== '불참') return false;
      if (F.f === 'net' && r.networking !== '참석') return false;
      if (F.f === 'lunch' && r.lunch !== '참석') return false;
      if (F.f === 'todo' && r.checked) return false;
      if (F.f === 'car' && !r.car_no) return false;
      if (q && [r.org, r.job_title, r.name, r.phone, r.email, r.companions, r.companion_name, r.companion_phone, r.car_no, r.note, r.memo].join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function cnt(fn) { return ROWS.filter(fn).length; }
  function render() {
    var list = filtered();
    var chips = [['', '전체'], ['att', '개막식 참석'], ['no', '불참'], ['net', '네트워킹 참석'], ['lunch', '오찬 참석'], ['car', '차량 등록'], ['todo', '미확인']];
    view.innerHTML =
      '<div class="link">회신 링크 <code>' + esc(rsvpLink()) + '</code><button class="btn" id="cp">복사</button></div>' +
      '<div class="stats">' +
        '<div class="st"><b>' + ROWS.length + '</b><span>전체 회신</span></div>' +
        '<div class="st"><b>' + cnt(function (r) { return r.ceremony === '참석'; }) + '</b><span>개막식 참석</span></div>' +
        '<div class="st"><b>' + cnt(function (r) { return r.ceremony === '불참'; }) + '</b><span>불참</span></div>' +
        '<div class="st"><b>' + cnt(function (r) { return r.networking === '참석'; }) + '</b><span>VIP 네트워킹 (213호)</span></div>' +
        '<div class="st"><b>' + cnt(function (r) { return r.lunch === '참석'; }) + '</b><span>개막 오찬 (214~216호)</span></div>' +
        '<div class="st"><b>' + cnt(function (r) { return !!r.car_no; }) + '</b><span>차량 등록</span></div>' +
        '<div class="st"><b>' + cnt(function (r) { return !!(r.companion_name || r.companions); }) + '</b><span>수행원 동반</span></div>' +
      '</div>' +
      '<div class="tools"><input id="q" placeholder="소속·성명·연락처 검색" value="' + esc(F.q) + '">' +
        chips.map(function (c) { return '<button class="chip' + (F.f === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + c[1] + '</button>'; }).join('') +
        '<span style="flex:1"></span><button class="btn" id="xl">엑셀 다운로드</button><button class="btn" id="pr">인쇄</button></div>' +
      '<div class="tw">' + (list.length ? '<table><thead><tr><th class="noprint">확인</th><th>#</th><th>회신일시</th><th>소속</th><th>직위</th><th>성명</th><th>연락처</th><th>이메일</th><th>개막식</th><th>네트워킹</th><th>오찬</th><th>수행원</th><th>수행원 연락처</th><th>차량번호</th><th>요청사항</th><th>메모</th><th class="noprint"></th></tr></thead><tbody>' +
        list.map(function (r, i) {
          return '<tr class="' + (r.checked ? 'done' : '') + '" data-id="' + r.id + '"><td data-l="확인" class="c noprint"><input type="checkbox" class="ck"' + (r.checked ? ' checked' : '') + '></td><td data-l="#">' + (i + 1) + '</td><td data-l="회신일시">' + dt(r.created_at) + '</td><td data-l="소속">' + esc(r.org) + '</td><td data-l="직위">' + esc(r.job_title) + '</td><td data-l="성명"><b>' + esc(r.name) + '</b></td><td data-l="연락처"><a href="tel:' + esc(r.phone) + '" style="color:inherit">' + esc(r.phone) + '</a></td><td data-l="이메일">' + esc(r.email) + '</td><td data-l="개막식" class="c">' + yn(r.ceremony) + '</td><td data-l="네트워킹" class="c">' + yn(r.networking) + '</td><td data-l="오찬" class="c">' + yn(r.lunch) + '</td><td data-l="수행원">' + esc(r.companion_name || r.companions) + '</td><td data-l="수행원 연락처">' + (r.companion_phone ? '<a href="tel:' + esc(r.companion_phone) + '" style="color:inherit">' + esc(r.companion_phone) + '</a>' : '') + '</td><td data-l="차량번호"><b>' + esc(r.car_no) + '</b></td><td data-l="요청사항">' + esc(r.note) + '</td><td data-l="메모"><input class="memo" value="' + esc(r.memo) + '"></td><td data-l="" class="noprint"><button class="btn del" style="padding:4px 8px">삭제</button></td></tr>';
        }).join('') + '</tbody></table>' : '<div class="empty">' + (ROWS.length ? '조건에 맞는 회신이 없습니다.' : '아직 접수된 회신이 없습니다.') + '</div>') + '</div>';

    var q = document.getElementById('q');
    q.oninput = function () { F.q = q.value; var pos = q.selectionStart; render(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    view.querySelectorAll('.chip').forEach(function (c) { c.onclick = function () { F.f = c.dataset.f; render(); }; });
    document.getElementById('cp').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(rsvpLink()); this.textContent = '복사됨'; };
    document.getElementById('pr').onclick = function () { window.print(); };
    document.getElementById('xl').onclick = excel;
    view.querySelectorAll('tbody tr').forEach(function (tr) {
      var r = ROWS.find(function (x) { return x.id === tr.dataset.id; });
      tr.querySelector('.ck').onchange = function () { var v = this.checked; sb.from('opening_rsvps').update({ checked: v }).eq('id', r.id).then(function (res) { if (!res.error) { r.checked = v; render(); } }); };
      tr.querySelector('.memo').onchange = function () { var v = this.value; sb.from('opening_rsvps').update({ memo: v }).eq('id', r.id).then(function (res) { if (!res.error) r.memo = v; }); };
      tr.querySelector('.del').onclick = function () {
        if (!confirm(r.org + ' ' + r.name + ' 님의 회신을 삭제할까요? 되돌릴 수 없습니다.')) return;
        sb.from('opening_rsvps').delete().eq('id', r.id).then(function (res) { if (!res.error) { ROWS = ROWS.filter(function (x) { return x.id !== r.id; }); render(); } });
      };
    });
  }
  function excel() {
    var go = function (X) {
      var rows = filtered().map(function (r, i) {
        return { '번호': i + 1, '회신일시': new Date(r.created_at).toLocaleString('ko-KR'), '소속': r.org, '직위': r.job_title, '성명': r.name, '연락처': r.phone, '이메일': r.email || '',
          '개막식': r.ceremony || '', 'VIP 네트워킹': r.networking || '', '개막 오찬': r.lunch || '', '수행원': r.companion_name || r.companions || '', '수행원 연락처': r.companion_phone || '', '차량번호': r.car_no || '', '요청사항': r.note || '', '확인': r.checked ? 'O' : '', '메모': r.memo || '' };
      });
      var ws = X.utils.json_to_sheet(rows), wb = X.utils.book_new();
      ws['!cols'] = [6, 20, 24, 14, 10, 16, 24, 8, 12, 10, 20, 16, 12, 30, 6, 24].map(function (w) { return { wch: w }; });
      X.utils.book_append_sheet(wb, ws, '개막식 회신');
      var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
      X.writeFile(wb, 'BIMTC2026_개막식회신_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.xlsx');
    };
    if (window.XLSX) return go(window.XLSX);
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function () { go(window.XLSX); }; document.head.appendChild(s);
  }
  boot();
})();
</script>
</body>
</html>
